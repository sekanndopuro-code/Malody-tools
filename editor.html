<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slide Editor Web (prototype)</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#151520;color:#ddd;font:14px system-ui;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#20202e;align-items:center;z-index:2}
#bar button,#bar select,#bar label{background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:7px 9px;font-size:12px;touch-action:manipulation}
#bar button.on{background:#3a6ea5;border-color:#7db4e8}
#bar button.chainOn{background:#2f8a4b;border-color:#66d488}
#bar button.join{background:#a0522d;border-color:#d97a4a}
#bar select.mode{background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:6px;font-size:12px}
#bar .sp{flex-basis:100%;height:0}
#wrap{position:relative;flex:1}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#time{font:11px monospace;color:#9cf;padding:0 4px}
input[type=number]{width:64px;background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px}
#panel{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:82vw;background:#1b1b26;border-left:1px solid #333;
 transform:translateX(100%);transition:transform .18s;z-index:5;display:flex;flex-direction:column;overflow:hidden}
#panel.on{transform:translateX(0)}
#panel h3{margin:0;padding:10px;font-size:13px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
#panel h3 button{background:none;border:none;color:#ddd;font-size:16px;padding:2px 6px}
#pList{flex:1;overflow-y:auto;padding:6px}
.pItem{background:#242434;border:1px solid #3a3a4d;border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px}
.pItem .pName{font-weight:bold;color:#9cf;word-break:break-all}
.pItem .pMeta{color:#888;font-size:10px;margin:2px 0 6px}
.pItem .pBtns{display:flex;gap:6px}
.pItem button{flex:1;background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:6px;font-size:11px}
.pItem button.run{background:#2f6b3a;border-color:#4f9d5e}
.pItem button.del{background:#6b2f2f;border-color:#9d4f4f}
#pLoad{display:block;width:100%;padding:8px;margin:6px 0;text-align:center;background:#3a6ea5;border:1px solid #7db4e8;border-radius:6px;font-size:12px}
#pEmpty{color:#777;font-size:11px;padding:10px;text-align:center}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;
 border-radius:8px;font-size:12px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.min.js"></script>
</head>
<body>
<div id="bar">
 <label>MC<input type="file" id="fMc" hidden></label>
 <label>Audio<input type="file" id="fAu" hidden></label>
 <button id="bSave">保存</button>
 <button id="bPlay">▶</button><button id="bStop">■</button><button id="bHere">_here</button>
 <span id="time">--:--</span>
 <select id="sSnap"></select>
 <button id="zIn">+</button><button id="zOut">−</button>
 <span class="sp"></span>
 <button data-t="move" class="on">移動</button><button data-t="box">範囲選択</button><button data-t="chain" title="スライドを結合する順にタップで選択">順番に選択</button>
 <button id="bClear">選択解除</button><button id="bChainClr" title="順番選択(「順番に選択」で選んだもの)をリセット">順番選択解除</button>

 <button id="bJoin" class="join" title="選択した順番でスライドを1つに結合">折り返し敷</button>
 <button id="bJoinAuto" class="join" title="「順番に選択」で判定を残す本体を1本選び、「範囲」で装飾スライドをまとめて選択→本体の始点beat順(同beatは順不同)で自動的に折り返し結合">範囲で折り返し敷</button>
 <button id="bBranch" class="join" title="選択順の1本目を本体・残りを枝分かれ装飾として一筆書き結合">枝分かれ敷</button>
 <button id="bBranchAuto" class="join" title="「順番に選択」で判定を残す本体を1本選び、「範囲」で装飾スライドをまとめて選択→本体の始点beat順(同beatは順不同)で自動的に枝分かれ結合">範囲で枝分かれ敷</button>
 <button id="bSendBack" title="選択中のスライドの当たり判定を後回しにして、重なった下のスライドをタップで選べるようにする">背面へ</button>
 <button id="bUndo">⟲</button><button id="bRedo">⟳</button>
 <span>off</span><input type="number" id="oV" step="1">
 <span class="sp"></span>
 <button id="bPlugin">🔌プラグイン</button>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="panel">
 <h3>プラグイン<button id="pClose">✕</button></h3>
 <div style="padding:8px">
  <label id="pLoad"><input type="file" id="fPlugin" accept=".lua" multiple hidden>＋ 外部プラグインを読み込む(.lua)</label>
 </div>
 <div id="pList"><div id="pEmpty">まだ読み込まれていません</div></div>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ========== ユーティリティ ========== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,n)=>((a%n)+n)%n;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const b2f=b=>(b&&b[2])?b[0]+b[1]/b[2]:(b?b[0]:0);  // beat配列→小数（分母0も安全に処理：結合生成の[m,0,0]でNaNにならない）
function fracBeat(v,den){const num=Math.round(v*den);return[Math.floor(num/den),mod(num,den),den];}

/* ========== 状態 ========== */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,trackL=8,trackW=1,playY=0;
let ppb=60,viewBeat=0,curBeat=0,snapDen=4;
let tool='move';
const barW=26;
let mini=null,mctx=null,totalBeats=1;
let nmin=new Float64Array(0),nmax=new Float64Array(0);
let data=null,notes=[],starts=new Float64Array(0),order=[];
let sel=new Set(),baseName='chart';           // sel は永続ID(nid)の集合
let chainOrder=[];                            // 「順番に選択」ツールで選択したnidの順序付き配列
let chainOrderSet=new Set();                  // 高速参照用（chainOrderと同期）
let backSet=new Set();                        // 「背面へ」で当たり判定を後回しにしたnidの集合（重なり選択用）
let dirty=true,rafPend=false;

/* ===== ノーツ永続ID (プラグインからの参照用) =====
   配列indexは削除/追加で容易にズレるため、ノーツオブジェクトの identity に
   対して WeakMap でIDを振り、id⇔index の対応表を rebuildIndex() の都度作り直す。
   このIDはファイル保存時のJSONには一切含まれない（セッション内のみ有効）。 */
let noteId=new WeakMap(),nextNid=1,idToIdx=new Map();
function nidOf(n){let id=noteId.get(n);if(id==null){id=nextNid++;noteId.set(n,id);}return id;}
function idxOf(nid){return idToIdx.has(nid)?idToIdx.get(nid):-1;}

/* ===== undo/redo ===== */
let undoStack=[],redoStack=[];
const snap=()=>JSON.stringify(notes);
function pushUndo(){undoStack.push(snap());if(undoStack.length>30)undoStack.shift();redoStack.length=0;}
function undo(){if(!undoStack.length||!data)return;
 redoStack.push(snap());notes=JSON.parse(undoStack.pop());data.note=notes;
 sel.clear();chainOrder.length=0;chainOrderSet.clear();backSet.clear();rebuildIndex();req();}
function redo(){if(!redoStack.length||!data)return;
 undoStack.push(snap());notes=JSON.parse(redoStack.pop());data.note=notes;
 sel.clear();chainOrder.length=0;chainOrderSet.clear();backSet.clear();rebuildIndex();req();}
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;   // デスクトップ補助
 const k=e.key.toLowerCase();
 if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
 else if(k==='y'){e.preventDefault();redo();}});

/* ========== 座標変換 ========== */
const x2px=x=>trackL+x/255*trackW;
const px2x=p=>(p-trackL)/trackW*255;
const b2y=b=>playY-(b-viewBeat)*ppb;
const y2b=y=>viewBeat+(playY-y)/ppb;

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 trackL=barW+8;trackW=W-trackL-8;playY=H*0.62;buildMini();req();}
addEventListener('resize',resize);

/* ========== BPM / 時刻 ========== */
let bpmL=[];
function rebuildBpm(){bpmL.length=0;for(const e of(data?.time||[]))bpmL.push({b:b2f(e.beat),spb:60/e.bpm});
 if(!bpmL.length)bpmL.push({b:0,spb:60/220});}
function secAt(i){let t=0;for(let k=1;k<=i;k++)t+=(bpmL[k].b-bpmL[k-1].b)*bpmL[k-1].spb;return t;}
function beatToSec(b){let i=bpmL.length-1;while(i>0&&bpmL[i].b>b)i--;return secAt(i)+(b-bpmL[i].b)*bpmL[i].spb;}
function secToBeat(t){let i=0;while(i<bpmL.length-1&&t>=secAt(i+1))i++;return bpmL[i].b+(t-secAt(i))/bpmL[i].spb;}

/* ========== オーディオブロック ========== */
let AC=null,buffer=null,srcN=null,playStart=0,playing=false,started=false,offsetMs=0;
let playFromSec=0;
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
const songSec=()=>AC.currentTime-playStart+playFromSec;
function play(){const a=ac();
 if(!started){                                   // 初回/stop後のみ音源スタート
  const startSec=beatToSec(curBeat);playFromSec=startSec;
  if(buffer){const bufOff=startSec-offsetMs/1000;
   srcN=a.createBufferSource();srcN.buffer=buffer;srcN.connect(a.destination);
   srcN.start(a.currentTime+Math.max(0,-bufOff),Math.max(0,bufOff));
   playStart=a.currentTime+Math.max(0,-bufOff);}
  else playStart=a.currentTime;
  started=true;}
 a.resume();playing=true;$('#bPlay').textContent='⏸';loop();}
function pause(){if(!playing)return;playing=false;
 curBeat=secToBeat(songSec());                   // 凍結時点を正確に保持
 if(AC)AC.suspend();                             // クロック凍結＝サンプル精度で停止
 $('#bPlay').textContent='▶';req();}
function stopPlay(){playing=false;started=false;stopSrc();
 if(AC)AC.resume();curBeat=0;viewBeat=0;$('#bPlay').textContent='▶';req();}
function stopSrc(){if(srcN){try{srcN.stop()}catch(e){}srcN=null;}}
function nudge(d){offsetMs+=d;$('#oV').value=offsetMs;if(playing)playStart-=d/1000;req();}

/* ===== インデックス：min/max beatを保持（segの折り返し・マイナスも含む） ===== */
function rebuildIndex(){const m=notes.length;
 nmin=new Float64Array(m);nmax=new Float64Array(m);order.length=0;idToIdx.clear();
 for(let i=0;i<m;i++){const n=notes[i];
  if(!n){nmin[i]=1e18;nmax[i]=1e18;continue;}
  idToIdx.set(nidOf(n),i);
  if(n.sound){nmin[i]=1e18;nmax[i]=1e18;continue;}
  const b=b2f(n.beat);let mn=b,mx=b;
  if(n.seg)for(const s of n.seg){const sb=b+b2f(s.beat);if(sb<mn)mn=sb;if(sb>mx)mx=sb;}
  nmin[i]=mn;nmax[i]=mx;order.push(i);}
 order.sort((a,b)=>nmin[a]-nmin[b]);
 buildMini();}
function upperBound(t){let a=0,b=order.length;while(a<b){const m=(a+b)>>1;
 if(nmin[order[m]]<=t)a=m+1;else b=m;}return a;}

/* ===== ミニマップ（構造変更時のみ焼直し） ===== */
function buildMini(){if(!data||H<10)return;
 if(!mini){mini=document.createElement('canvas');mctx=mini.getContext('2d');}
 mini.width=barW*DPR;mini.height=H*DPR;mctx.setTransform(DPR,0,0,DPR,0,0);
 let tb=1;for(let i=0;i<notes.length;i++)if(!notes[i].sound&&nmax[i]>tb)tb=nmax[i];
 totalBeats=tb;
 mctx.fillStyle='#20202e';mctx.fillRect(0,0,barW,H);
 for(let i=0;i<notes.length;i++){const n=notes[i];if(!n||n.sound)continue;
  mctx.fillStyle=n.type===4?'#e6cf3f':(n.seg?'#8fd0f0':'#ddd');
  mctx.fillRect(3,H-b2f(n.beat)/totalBeats*H,barW-6,1.5);}}
const miniY=b=>H-clamp(b,0,totalBeats)/totalBeats*H;
function drawMini(){if(!mini)return;ctx.drawImage(mini,0,0,barW,H);if(!data)return;
 const t=miniY(y2b(0)),b=miniY(y2b(H));           // 表示ウィンドウ枠
 ctx.fillStyle='rgba(255,255,255,.13)';ctx.fillRect(0,t,barW,Math.max(2,b-t));
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.beginPath();
 ctx.moveTo(0,t+.5|0);ctx.lineTo(barW,t+.5|0);ctx.moveTo(0,b+.5|0);ctx.lineTo(barW,b+.5|0);ctx.stroke();
 ctx.strokeStyle='#f44';const pm=miniY(playing?viewBeat:curBeat)|0;   // 再生マーカー
 ctx.beginPath();ctx.moveTo(0,pm+.5);ctx.lineTo(barW,pm+.5);ctx.stroke();}

/* ========== 描画ループ ========== */
function req(){if(!rafPend){rafPend=true;requestAnimationFrame(()=>{rafPend=false;render();});}}
function loop(){if(!playing)return;
 const s=songSec();viewBeat=secToBeat(s);
 if(buffer&&s>buffer.duration+0.5){pause();return;}
 $('#time').textContent=fmt(s);render();requestAnimationFrame(loop);}
const fmt=s=>{s=Math.max(0,s);const m=s/60|0,ss=s%60;return m+':'+(ss<10?'0':'')+ss.toFixed(2);};

/* ===== 描画：厳密culling（1beatでも重なれば描画） ===== */
function render(){ctx.clearRect(0,0,W,H);drawMini();drawGrid();
 if(data){const v0=y2b(H),v1=y2b(0),hi=upperBound(v1);
  for(let k=0;k<hi;k++){const i=order[k];if(nmax[i]<v0)continue;drawNote(i);}
  ctx.strokeStyle='rgba(140,220,255,.9)';ctx.lineWidth=1.5;
  for(let k=0;k<hi;k++){const i=order[k];
   if(nmax[i]>=v0&&notes[i]&&sel.has(nidOf(notes[i]))&&notes[i].seg)drawRibbonStroke(notes[i],b2f(notes[i].beat));}
  drawChainOverlay(v0);
  drawBox();}
 drawModules();drawPlayline();}

/* ===== 「順番に選択」用: 選択済みスライドを半透明カラー＋順番番号でオーバーレイ ===== */
function drawChainOverlay(v0){if(!chainOrder.length)return;
 for(let k=0;k<chainOrder.length;k++){const nid=chainOrder[k];const i=idxOf(nid);if(i<0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;
  if(nmax[i]<v0)continue;
  const b0=b2f(n.beat),pts=segPts(n,b0),hw=(n.w||57)/255*trackW/2;
  // 半透明の被せ色（1番目=赤 / それ以降=水色）
  const col=(k===0)?'rgba(255,60,60,.55)':'rgba(90,200,255,.45)';
  ctx.fillStyle=col;
  for(let p=0;p<pts.length-1;p++){const a=pts[p],b=pts[p+1];
   if((a.py<-40&&b.py<-40)||(a.py>H+40&&b.py>H+40))continue;
   ctx.beginPath();addRibbonQuad(a,b,hw);ctx.fill();}
  // 始点bar強調
  const y=b2y(b0),w=(n.w||57)/255*trackW;
  ctx.fillStyle=(k===0)?'rgba(255,60,60,.85)':'rgba(90,200,255,.85)';
  ctx.fillRect(x2px(n.x)-w/2,y-4,w,8);
  // 順番数字
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;
  ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  const label=String(k+1);
  ctx.strokeText(label,x2px(n.x),y);
  ctx.fillText(label,x2px(n.x),y);
  ctx.textAlign='start';ctx.textBaseline='alphabetic';ctx.lineWidth=1;
 }
}

function drawModules(){for(const m of pluginModules.values()){
 const y=b2y(m.Beat||0);if(y<-60||y>H+60)continue;
 const x=x2px(clamp(m.X||0,0,255));
 ctx.globalAlpha=(m.Alpha==null?1:m.Alpha);
 if(m.__kind==='text'){ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(m.Text||'',x,y);}
 else{const w=m.Width||32,h=m.Height||32;ctx.strokeStyle='#f0f';ctx.strokeRect(x-w/2,y-h/2,w,h);
  ctx.fillStyle='rgba(255,0,255,.15)';ctx.fillRect(x-w/2,y-h/2,w,h);}
 ctx.globalAlpha=1;}}

function drawGrid(){const v0=y2b(H),v1=y2b(0);ctx.lineWidth=1;
 ctx.strokeStyle='rgba(255,255,255,.13)';ctx.beginPath();
 for(let x=0;x<=255;x+=32){const p=Math.round(x2px(x))+.5;ctx.moveTo(p,0);ctx.lineTo(p,H);}ctx.stroke();
 let s=1/snapDen;while(s*ppb<7)s*=2;
 ctx.strokeStyle='rgba(255,255,255,.09)';ctx.beginPath();
 for(let b=Math.ceil(v0/s)*s;b<=v1;b+=s){const y=Math.round(b2y(b))+.5;ctx.moveTo(trackL,y);ctx.lineTo(trackL+trackW,y);}ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.28)';ctx.beginPath();
 for(let b=Math.ceil(v0);b<=Math.floor(v1);b++){const y=Math.round(b2y(b))+.5;ctx.moveTo(trackL,y);ctx.lineTo(trackL+trackW,y);}ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='10px monospace';
 for(let b=Math.ceil(v0);b<=Math.floor(v1);b++)if(ppb>13||b%4===0)ctx.fillText(b,barW+2,b2y(b)+3);}

function segPts(n,b0){const p=[{px:x2px(n.x),py:b2y(b0)}];
 if(n.seg)for(const s of n.seg)p.push({px:x2px(n.x+(s.x||0)),py:b2y(b0+b2f(s.beat))});return p;}

function addRibbonQuad(a,b,hw){
 ctx.moveTo(a.px-hw,a.py);ctx.lineTo(a.px+hw,a.py);
 ctx.lineTo(b.px+hw,b.py);ctx.lineTo(b.px-hw,b.py);
 ctx.closePath();}

function drawRibbon(n,pts){const m=pts.length;if(m<2)return;
 const hw=(n.w||57)/255*trackW/2;
 // 区間ごとに個別fill：重なった区間はαが積み重なって白くなる仕様のため、
 // 1パスにまとめず1区間＝1fillにする（まとめてしまうと重なり部のαが蓄積せず、
 // さらにsegが逆行/折り返すと巻き方向が反転してnonzero fillで相殺＝消える不具合も出る）。
 ctx.fillStyle='rgba(235,242,250,.35)';
 for(let p=0;p<m-1;p++){const a=pts[p],b=pts[p+1];
  if((a.py<-40&&b.py<-40)||(a.py>H+40&&b.py>H+40))continue;   // 画面外culling
  ctx.beginPath();addRibbonQuad(a,b,hw);ctx.fill();}}

function drawRibbonStroke(n,b0){const pts=segPts(n,b0),m=pts.length;if(m<2)return;
 const hw=(n.w||57)/255*trackW/2;
 ctx.beginPath();
 for(let p=0;p<m-1;p++){
  ctx.moveTo(pts[p].px-hw,pts[p].py);ctx.lineTo(pts[p].px+hw,pts[p].py);
  ctx.lineTo(pts[p+1].px+hw,pts[p+1].py);ctx.lineTo(pts[p+1].px-hw,pts[p+1].py);
  ctx.closePath();}
 ctx.stroke();}

function drawDots(pts){ctx.strokeStyle='#fff';ctx.lineWidth=2;
 ctx.fillStyle='rgba(150,205,245,.95)';
 for(let p=1;p<pts.length;p++){
  // 密集segでは前点と2px未満しか離れていない中間点を描き飛ばす（終点は必ず描く）
  if(p<pts.length-1&&Math.abs(pts[p].py-pts[p-1].py)<2&&Math.abs(pts[p].px-pts[p-1].px)<2)continue;
  ctx.beginPath();
  ctx.arc(pts[p].px,pts[p].py,4.5,0,7);ctx.fill();ctx.stroke();}
 ctx.lineWidth=1;}

function drawHandles(i,n,b0){const pts=segPts(n,b0);ctx.font='9px monospace';
 ctx.strokeStyle='#f80';ctx.lineWidth=2;ctx.fillStyle='#ff0';
 for(let p=1;p<pts.length;p++){ctx.beginPath();
  ctx.arc(pts[p].px,pts[p].py,8,0,7);ctx.stroke();
  ctx.fillText(p,pts[p].px+6,pts[p].py-6);}ctx.lineWidth=1;}

function drawNote(i){const n=notes[i];if(!n||n.sound)return;
 const b0=b2f(n.beat);
 if(n.seg){const pts=segPts(n,b0);
  drawRibbon(n,pts);drawDots(pts);drawBar(i,n,b2y(b0));
  if(sel.has(nidOf(n)))drawHandles(i,n,b0);}
 else{const y=b2y(b0);if(y<-40||y>H+40)return;drawBar(i,n,y);}}

function drawBar(i,n,y){const w=(n.w||57)/255*trackW,cx=x2px(n.x),h=7;
 if(n.type===4){ctx.fillStyle='#e6cf3f';ctx.strokeStyle='#93801a';}
 else{ctx.fillStyle='#a8dcf5';ctx.strokeStyle='#4d94c8';}
 ctx.fillRect(cx-w/2,y-h/2,w,h);ctx.strokeRect(cx-w/2,y-h/2,w,h);
 if(sel.has(nidOf(n))){ctx.strokeStyle='#ff9d2e';ctx.lineWidth=2;ctx.strokeRect(cx-w/2-2,y-h/2-2,w+4,h+4);ctx.lineWidth=1;}}

function drawBox(){if(!boxS||boxS.x1==null)return;ctx.strokeStyle='#ff0';ctx.strokeRect(
 Math.min(boxS.x,boxS.x1),Math.min(boxS.y,boxS.y1),Math.abs(boxS.x-boxS.x1),Math.abs(boxS.y-boxS.y1));}

function drawPlayline(){const b=playing?viewBeat:curBeat,y=b2y(b);
 ctx.strokeStyle='#f44';ctx.beginPath();ctx.moveTo(0,y+.5|0);ctx.lineTo(W,y+.5|0);ctx.stroke();}

/* ===== hitNoteも厳密culling ===== */
function hitNote(px,py){if(!data)return null;
 const v0=y2b(H),hi=upperBound(y2b(0));
 const scan=(skipBack)=>{
  for(let k=hi-1;k>=0;k--){const i=order[k];if(nmax[i]<v0)continue;
   const n=notes[i];if(skipBack&&backSet.has(nidOf(n)))continue;
   const b0=b2f(n.beat);
   if(n.seg){const pts=segPts(n,b0);
    for(let p=pts.length-1;p>=1;p--)
     if(Math.abs(px-pts[p].px)<12&&Math.abs(py-pts[p].py)<12)return{i,seg:p-1};}
   const y=b2y(b0),hw=(n.w||57)/255*trackW/2+6;
   if(Math.abs(py-y)<9&&Math.abs(px-x2px(n.x))<hw+4)return{i};}
  return null;};
 return scan(true)||scan(false);}   // まず「背面へ」対象を除外して探し、無ければそれも含めて探す

/* ===== 「順番に選択」用ヒット判定 =====
   始点bar / seg点 / リボン多角形の内側 いずれに触れてもヒット。segを持つノートのみを対象。 */
function pointInQuad(px,py,q){ // 4点の凸台形（水平辺）内部判定
 const yMin=Math.min(q[0].py,q[3].py),yMax=Math.max(q[1].py,q[2].py);
 if(py<Math.min(yMin,yMax)-.5||py>Math.max(yMin,yMax)+.5)return false;
 // q[0]-q[3]が上辺(px-hw / px+hw @上y), q[1]-q[2]が下辺 の想定で作るがここは矩形/台形として判定
 // 汎用に多角形内包判定（レイキャスト）を使う
 let inside=false;
 for(let i=0,j=q.length-1;i<q.length;j=i++){
  const xi=q[i].px,yi=q[i].py,xj=q[j].px,yj=q[j].py;
  const intersect=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/((yj-yi)||1e-9)+xi);
  if(intersect)inside=!inside;
 }
 return inside;
}
function hitSlideForChain(px,py){if(!data)return -1;
 const v0=y2b(H),hi=upperBound(y2b(0));
 const scan=(skipBack)=>{
 for(let k=hi-1;k>=0;k--){const i=order[k];if(nmax[i]<v0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;
  const nid=nidOf(n);
  if(chainOrderSet.has(nid))continue;        // 選択済みは当たり判定を外し、重なった下のスライドを選べるようにする
  if(skipBack&&backSet.has(nid))continue;    // 「背面へ」対象も同様にまず除外する
  const b0=b2f(n.beat);
  // 1) 始点bar
  const y=b2y(b0),hw=(n.w||57)/255*trackW/2+6;
  if(Math.abs(py-y)<12&&Math.abs(px-x2px(n.x))<hw+4)return i;
  // 2) seg点
  const pts=segPts(n,b0);
  for(let p=pts.length-1;p>=1;p--)
   if(Math.abs(px-pts[p].px)<14&&Math.abs(py-pts[p].py)<14)return i;
  // 3) リボン多角形（各セグメント区間の四角）内部
  const rhw=(n.w||57)/255*trackW/2;
  for(let p=0;p<pts.length-1;p++){
   const quad=[
    {px:pts[p].px-rhw,py:pts[p].py},
    {px:pts[p+1].px-rhw,py:pts[p+1].py},
    {px:pts[p+1].px+rhw,py:pts[p+1].py},
    {px:pts[p].px+rhw,py:pts[p].py}
   ];
   if(pointInQuad(px,py,quad))return i;
  }
 }
 return -1;};
 const r=scan(true);return r>=0?r:scan(false);
}

/* ========== 編集操作 ========== */
/* ===== ポインタ：移動専用/範囲=編集+追加選択/ナビバー ===== */
let pointers=new Map(),pinchS=null,panS=null,dragS=null,segS=null,boxS=null,navS=null,downI=null,togPend=null;
let pClickX=0,pClickBeat=0;   // インタラクティブ型プラグイン用：直近のクリック位置
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
const navTo=p=>{viewBeat=clamp((H-p.y)/H*totalBeats,-2,totalBeats+2);req();};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);
 const p=pos(e);pointers.set(e.pointerId,p);
 if(pointers.size===2){const ps=[...pointers.values()];
  pinchS={d:dist(ps[0],ps[1]),ppb,my:(ps[0].y+ps[1].y)/2,vb:viewBeat};
  dragS=segS=panS=boxS=navS=null;return;}
 downI={p,moved:false};
 if(p.x<barW){navS=1;navTo(p);return;}                 // ナビバー＝ツール非依存
 if(tool==='plugin'){pClickX=px2x(p.x);pClickBeat=y2b(p.y);
  if(activeL)callLua(activeL,'OnDragStart');return;}
 if(tool==='chain'){panS={p,vb:viewBeat};return;}      // 順番選択：ドラッグはスクロール、タップはup時に判定
 if(tool==='move'){panS={p,vb:viewBeat};return;}       // 移動：全てスクロール専用
 if(tool==='box'){const h=hitNote(p.x,p.y);
  if(h&&h.seg!=null){segS={i:h.i,p:h.seg,pushed:false};return;}     // 白丸ドラッグ
  if(h){const nid=nidOf(notes[h.i]);const was=sel.has(nid);if(!was)sel.add(nid);
   togPend={nid,was};                                   // 動かさなければトグル
   dragS={p,origins:[...sel].map(idxOf).filter(i=>i>=0).map(i=>({i,b:b2f(notes[i].beat),x:notes[i].x})),pushed:false};return;}
  boxS={x:p.x,y:p.y};return;}                          // 範囲は追加方式
});
cv.addEventListener('pointermove',e=>{const p=pos(e);
 if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);
 if(pinchS&&pointers.size>=2){const ps=[...pointers.values()];
  ppb=clamp(pinchS.ppb*dist(ps[0],ps[1])/pinchS.d,6,500);
  viewBeat=pinchS.vb+(pinchS.my-(ps[0].y+ps[1].y)/2)/ppb;req();return;}
 if(!downI)return;
 if(Math.abs(p.x-downI.p.x)+Math.abs(p.y-downI.p.y)>6)downI.moved=true;
 if(navS){navTo(p);return;}
 if(tool==='plugin'){pClickX=px2x(p.x);pClickBeat=y2b(p.y);
  if(activeL)callLua(activeL,'OnDragMove');return;}
 if(boxS){boxS.x1=p.x;boxS.y1=p.y;req();return;}
 if(segS){if(!segS.pushed){pushUndo();segS.pushed=true;}const n=notes[segS.i],s=n.seg[segS.p];
  s.x=Math.round(px2x(p.x)-n.x);
  const num=Math.round((y2b(p.y)-b2f(n.beat))*snapDen);
  s.beat=[Math.floor(num/snapDen),mod(num,snapDen),snapDen];req();return;}
 if(dragS&&downI.moved){if(!dragS.pushed){pushUndo();dragS.pushed=true;}
  const dB=Math.round((dragS.p.y-p.y)/ppb*snapDen)/snapDen;
  const dx=Math.round((p.x-dragS.p.x)*255/trackW);
  for(const o of dragS.origins){notes[o.i].beat=fracBeat(o.b+dB,snapDen);
   notes[o.i].x=clamp(o.x+dx,0,255);}req();return;}
 if(panS){viewBeat=panS.vb+(p.y-panS.p.y)/ppb;req();}});
function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchS=null;
 const p=pos(e);
 if(navS){if(pointers.size===0){navS=null;downI=null;}return;}
 if(tool==='plugin'){if(activeL)callLua(activeL,(!downI||!downI.moved)?'OnClick':'OnDragEnd');downI=null;req();return;}
 if(tool==='chain'){
  if(downI&&!downI.moved){
   const i=hitSlideForChain(p.x,p.y);
   if(i>=0){const nid=nidOf(notes[i]);
    if(!chainOrderSet.has(nid)){chainOrder.push(nid);chainOrderSet.add(nid);
     toast(chainOrder.length===1?'メイン(1) を選択':'順番 '+chainOrder.length+' を追加');req();}
    else{toast('既に選択済みです');}
   }
  }
  panS=null;downI=null;req();return;
 }
 if(boxS&&(boxS.x1!=null)){                            // 範囲＝追加、解除しない
  const x0=Math.min(boxS.x,boxS.x1),x1=Math.max(boxS.x,boxS.x1);
  const bT=y2b(Math.min(boxS.y,boxS.y1)),bB=y2b(Math.max(boxS.y,boxS.y1));
  for(let i=0;i<notes.length;i++){const n=notes[i];if(!n||n.sound)continue;
   const b=b2f(n.beat);if(b<bB||b>bT)continue;
   const px=x2px(n.x);if(px>=x0&&px<=x1)sel.add(nidOf(n));}
  boxS=null;req();downI=null;return;}
 if(downI&&!downI.moved&&togPend&&togPend.was)sel.delete(togPend.nid); // タップ=トグル
 togPend=null;
 dragS=segS=panS=null;downI=null;req();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();
 if(e.ctrlKey)ppb=clamp(ppb*Math.exp(-e.deltaY*0.01),6,500);
 else viewBeat+=e.deltaY*0.02;req();},{passive:false});

/* ===== 「折り返し敷」= 選択順どおりにスライドを結合（index.htmlのロジック移植） ===== */
function beatToPointArr(beat){if(!beat||beat.length!==3)return 0;if(beat[2]===0)return beat[0];return beat[0]+(beat[1]/beat[2]);}
function _gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b?_gcd(b,a%b):(a||1);}
/* beat分数の分母には常に上限を設ける：この演算群は分母同士を掛け合わせて新しい分母を作るため、
   高精度チャート（分母1048576など）を何度も演算に通すと分母が数十億〜数兆に膨れ上がり、
   本家エディタ側の数値表現の限界を超えて壊れる（segが無関係な位置に散らばる）原因になっていた。
   出力のたびにこの上限（本家で動作確認済みの1048576）へ丸め込み、精度は1/1048576拍のまま実質無劣化で安全にする。 */
const MAX_BEAT_DEN=1048576;
function capBeatDen(m,n,d){
 if(d<=0)d=1;
 if(d<=MAX_BEAT_DEN){if(n===0)return[m,0,0];const g=_gcd(n,d);return[m,n/g,d/g];}
 let newNum=Math.round(n/d*MAX_BEAT_DEN);
 if(newNum>=MAX_BEAT_DEN){m+=1;newNum=0;}
 if(newNum===0)return[m,0,0];
 const g=_gcd(newNum,MAX_BEAT_DEN);return[m,newNum/g,MAX_BEAT_DEN/g];}
function beatDiffArr(b1,b2){if(!b1)return[0,0,0];if(!b2)return[...b1];
 const m1=b1[0],n1=b1[1]||0,d1=b1[2]===0?1:(b1[2]||1);
 const m2=b2[0],n2=b2[1]||0,d2=b2[2]===0?1:(b2[2]||1);
 const num1=(m1*d1+n1)*d2,num2=(m2*d2+n2)*d1,den=d1*d2;
 let diffNum=num1-num2;if(diffNum<0)diffNum=0;
 const m=Math.floor(diffNum/den),n=diffNum%den;
 return capBeatDen(m,n,den);}
function beatAddArr(b1,b2){if(!b1)return[...b2];if(!b2)return[...b1];
 const m1=b1[0],n1=b1[1]||0,d1=b1[2]===0?1:(b1[2]||1);
 const m2=b2[0],n2=b2[1]||0,d2=b2[2]===0?1:(b2[2]||1);
 const num1=n1*d2,num2=n2*d1,den=d1*d2;
 let num=num1+num2,m=m1+m2+Math.floor(num/den),n=num%den;
 return capBeatDen(m,n,den);}
function addOffsetToBeatArr(beat,offsetIndex){if(!beat||beat.length!==3||offsetIndex===0)return beat;
 const m=beat[0],n=beat[1]||0,d=beat[2]===0?1:(beat[2]||1),DEN=8477;
 let newNum=n*DEN+offsetIndex*d,newDen=d*DEN;
 let extraM=Math.floor(newNum/newDen),newM=m+extraM;newNum=newNum%newDen;
 return capBeatDen(newM,newNum,newDen);}
function fixDuplicateSegsArr(segArray){let used=[],fixed=0;const MICRO=9001;
 function micro(beat,c){if(!beat||beat.length!==3||c===0)return beat;
  const m=beat[0],n=beat[1],d=beat[2]===0?1:beat[2];
  let newNum=n*MICRO+c*d,newDen=d*MICRO;
  let extraM=Math.floor(newNum/newDen),newM=m+extraM;newNum=newNum%newDen;
  return capBeatDen(newM,newNum,newDen);}
 for(let i=0;i<segArray.length;i++){const item=segArray[i];let p=beatToPointArr(item.beat);
  let cnt=0,conflict=true,cur=p;
  while(conflict){conflict=false;
   for(let j=0;j<used.length;j++){if(Math.abs(cur-used[j])<1e-10){conflict=true;cnt++;cur=p+(cnt/MICRO);break;}}}
  if(cnt>0){item.beat=micro(item.beat,cnt);fixed++;}
  used.push(cur);}
 return fixed;}

function clearChain(){chainOrder.length=0;chainOrderSet.clear();backSet.clear();req();}

  const nid=chainOrder.pop();chainOrderSet.delete(nid);backSet.add(nid);req();

/* ===== 「折り返し敷」の中核ロジックを共通関数化。
   $('#bJoin')（完全手動の順番指定）と $('#bJoinAuto')（本体だけ手動選択・装飾はbeat順自動）の
   どちらからも同じロジックを呼べるようにし、既存の挙動は一切変えずに選択肢だけを増やす。
   targetSlides[0] が本体（判定を残す）、以降は結合順どおりに行ったり来たりしながら一筆書きされる。 */
function mergeJoinInto(targetSlides){
 const timeMode='keep';                     // 「間隔を保つ/詰める」切替は廃止し、常に間隔を保つ動作に固定
 const mainSlide=targetSlides[0];
 const mainX=(typeof mainSlide.x==='number')?mainSlide.x:0;
 const mainBeat=mainSlide.beat;
 const newSeg=[];

 for(let i=0;i<targetSlides.length;i++){
  const slide=targetSlides[i],segs=slide.seg;
  const curX=(typeof slide.x==='number')?slide.x:0;
  const offsetX=curX-mainX;
  const baseBeat=(timeMode==='keep')?beatDiffArr(slide.beat,mainBeat):[0,0,0];

  if(i%2===0){
   if(i>0){
    let startItem={beat:[...baseBeat],x:offsetX};
    startItem.beat=addOffsetToBeatArr(startItem.beat,i);
    newSeg.push(startItem);
   }
   for(let j=0;j<segs.length;j++){
    let segItem=JSON.parse(JSON.stringify(segs[j]));
    segItem.beat=beatAddArr(segItem.beat,baseBeat);
    segItem.beat=addOffsetToBeatArr(segItem.beat,i);
    segItem.x=(segItem.x||0)+offsetX;
    newSeg.push(segItem);
   }
  }else{
   for(let j=segs.length-1;j>=0;j--){
    let segItem=JSON.parse(JSON.stringify(segs[j]));
    segItem.beat=beatAddArr(segItem.beat,baseBeat);
    segItem.beat=addOffsetToBeatArr(segItem.beat,i);
    segItem.x=(segItem.x||0)+offsetX;
    newSeg.push(segItem);
   }
   let zero={beat:[...baseBeat],x:offsetX};
   zero.beat=addOffsetToBeatArr(zero.beat,i);
   newSeg.push(zero);
  }
 }
 const fixCount=fixDuplicateSegsArr(newSeg);
 mainSlide.seg=newSeg;

 // メイン以外を削除
 const removeSet=new Set(targetSlides.slice(1));
 data.note=notes=notes.filter(n=>!removeSet.has(n));
 return fixCount;
}

$('#bJoin').onclick=()=>{
 if(!data){alert('先にMCファイルを読み込んでください');return;}
 if(chainOrder.length<1){toast('「順番に選択」でスライドを選んでください');return;}
 // 選択順どおりにスライド実体を集める
 const targetSlides=[];
 for(const nid of chainOrder){const i=idxOf(nid);if(i<0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;targetSlides.push(n);}
 if(targetSlides.length<1){toast('有効なスライドがありません');return;}
 if(targetSlides.length===1){toast('スライドが1個のためバグ修復のみ実行します');}

 pushUndo();
 const fixCount=mergeJoinInto(targetSlides);
 clearChain();sel.clear();rebuildIndex();req();
 const msg=targetSlides.length===1
  ?('バグ修復のみ実行'+(fixCount>0?'（重複 '+fixCount+' 箇所修復）':'（重複なし）'))
  :(targetSlides.length+'個を結合しました'+(fixCount>0?'（重複 '+fixCount+' 箇所自動修復）':''));
 toast('✅ '+msg);
};

/* ===== 「範囲で折り返し敷」＝ 本体(判定あり)は「順番に選択」で1本だけ手動指定し、
   装飾は「範囲選択」でまとめて選んだ集合(sel)から、結合する順番にこだわらない前提で自動決定する。
   折り返し敷は行ったり来たりを順番どおりに一筆書きするため挿入順が結果に直結するので、
   装飾の始点beat昇順を結合順として採用する。beatが重複する装飾同士は結合順を気にしなくてよいため、
   同beatグループ内だけランダムに並べ替える（Fisher-Yates）。 */
$('#bJoinAuto').onclick=()=>{
 if(!data){alert('先にMCファイルを読み込んでください');return;}
 if(chainOrder.length!==1){toast('「順番に選択」で判定を残す本体スライドを1本だけ選んでください');return;}
 const mainNid=chainOrder[0];
 const mainI=idxOf(mainNid);
 const mainSlide=mainI>=0?notes[mainI]:null;
 if(!mainSlide||mainSlide.sound||!mainSlide.seg){toast('本体スライドが見つかりません');return;}

 // 装飾＝範囲選択(sel)から本体自身を除いたもの
 const decoSlides=[];
 for(const nid of sel){if(nid===mainNid)continue;const i=idxOf(nid);if(i<0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;decoSlides.push(n);}
 if(decoSlides.length<1){toast('「範囲選択」で装飾にするスライドをまとめて選んでください');return;}

 // 始点beat昇順に整列。同beatはランダムに並べる（結合順にこだわらないため）
 const withBeat=decoSlides.map(n=>({n,b:b2f(n.beat)}));
 withBeat.sort((a,b)=>a.b-b.b);
 for(let i=0;i<withBeat.length;){
  let j=i+1;
  while(j<withBeat.length&&Math.abs(withBeat[j].b-withBeat[i].b)<1e-9)j++;
  for(let k=j-1;k>i;k--){const r=i+Math.floor(Math.random()*(k-i+1));
   [withBeat[k],withBeat[r]]=[withBeat[r],withBeat[k]];}
  i=j;
 }
 const targetSlides=[mainSlide,...withBeat.map(o=>o.n)];

 pushUndo();
 const fixCount=mergeJoinInto(targetSlides);
 clearChain();sel.clear();rebuildIndex();req();
 toast('✅ 範囲で折り返し結合: 本体+'+(targetSlides.length-1)+'本を処理'+(fixCount>0?'（重複 '+fixCount+' 箇所自動修復）':''));
};

/* ===== 幹スライドの相対Xを任意pointで補間取得（segmismatch移植） ===== */
function getRelXAtArr(mainPoints,targetPoint){
 if(mainPoints.length===1)return mainPoints[0].relX;
 if(targetPoint<=mainPoints[0].point)return mainPoints[0].relX;
 if(targetPoint>=mainPoints[mainPoints.length-1].point)return mainPoints[mainPoints.length-1].relX;
 for(let i=0;i<mainPoints.length-1;i++){const p1=mainPoints[i],p2=mainPoints[i+1];
  if(p1.point<=targetPoint&&targetPoint<=p2.point){
   if(Math.abs(p2.point-p1.point)<1e-10)return p2.relX;
   const t=(targetPoint-p1.point)/(p2.point-p1.point);
   return p1.relX+(p2.relX-p1.relX)*t;}}
 return mainPoints[mainPoints.length-1].relX;}

/* ===== 「枝分かれ敷」= 1本目を本体幹・残りを枝装飾として一筆書き結合（segmismatch移植） =====
   本体1本+装飾N本を結合する中核ロジックを共通関数化。
   $('#bBranch')（完全手動の順番指定）と $('#bBranchAuto')（本体だけ手動選択・装飾はbeat順自動）の
   どちらからも同じロジックを呼べるようにし、既存の挙動は一切変えずに選択肢だけを増やす。 */
function mergeBranchesInto(mainSlide,branches){
 const mainBeat=mainSlide.beat;
 const mainX=(typeof mainSlide.x==='number')?mainSlide.x:0;

 // 幹seg：折り返し（point逆行）以前の有効部分だけを切り出す
 const mainOriginalSegs=mainSlide.seg||[];
 const effectiveMainSegs=[];
 {let prev=0;
  for(let i=0;i<mainOriginalSegs.length;i++){
   const p=beatToPointArr(mainOriginalSegs[i].beat);
   if(p<prev-1e-10)break;
   effectiveMainSegs.push(mainOriginalSegs[i]);prev=p;}}

 const mainPoints=[{point:0,relX:0}];
 for(const s of effectiveMainSegs)mainPoints.push({point:beatToPointArr(s.beat),relX:s.x||0});

 const events=[];
 let mainLastSeg=null,mainLastPoint=0;
 if(effectiveMainSegs.length>0){
  mainLastSeg=effectiveMainSegs[effectiveMainSegs.length-1];
  mainLastPoint=beatToPointArr(mainLastSeg.beat);
  for(let i=0;i<effectiveMainSegs.length-1;i++){const s=effectiveMainSegs[i];
   events.push({type:'main_seg',point:beatToPointArr(s.beat),beat:s.beat,x:s.x||0});}}

 for(const branch of branches){
  const branchSegs=branch.seg||[];
  const branchX=(typeof branch.x==='number')?branch.x:0;
  const offsetX=branchX-mainX;
  const offsetBeat=beatDiffArr(branch.beat,mainBeat);
  const lastSegBeat=branchSegs.length>0?branchSegs[branchSegs.length-1].beat:[0,0,0];
  const endRelBeat=beatAddArr(offsetBeat,lastSegBeat);
  const endRelPoint=beatToPointArr(endRelBeat);
  const trunkRelX=Math.floor(getRelXAtArr(mainPoints,endRelPoint));
  events.push({type:'branch_insert',point:endRelPoint,beat:endRelBeat,x:trunkRelX,
   branchSegs,offsetX,offsetBeat});}

 // point昇順、同点ならmain_segを先に
 events.sort((a,b)=>{const d=a.point-b.point;
  if(Math.abs(d)>1e-10)return d;
  if(a.type==='main_seg'&&b.type==='branch_insert')return -1;
  if(a.type==='branch_insert'&&b.type==='main_seg')return 1;
  return 0;});

 const newSeg=[];
 let currentAbsPoint=0;
 for(const ev of events){
  if(ev.type==='main_seg'){
   newSeg.push({beat:[...ev.beat],x:ev.x});
   currentAbsPoint=ev.point;
  }else{
   // 枝の終点(幹上)まで移動 → 枝を逆行でたどる → 枝の始点へ → 枝を順行でたどる → 幹上へ戻る
   newSeg.push({beat:[...ev.beat],x:ev.x});
   for(let j=ev.branchSegs.length-1;j>=0;j--){const s=ev.branchSegs[j];
    newSeg.push({beat:beatAddArr(ev.offsetBeat,s.beat),x:ev.offsetX+(s.x||0)});}
   newSeg.push({beat:[...ev.offsetBeat],x:ev.offsetX});
   for(let j=0;j<ev.branchSegs.length;j++){const s=ev.branchSegs[j];
    newSeg.push({beat:beatAddArr(ev.offsetBeat,s.beat),x:ev.offsetX+(s.x||0)});}
   newSeg.push({beat:[...ev.beat],x:ev.x});
   currentAbsPoint=ev.point;}}

 // 装飾が幹終点より未来にある場合：幹を逆行して戻す
 if(mainLastSeg&&currentAbsPoint>mainLastPoint){
  for(let i=events.length-1;i>=0;i--){const ev=events[i];
   if(ev.type==='main_seg'&&ev.point<=currentAbsPoint&&ev.point>mainLastPoint)
    newSeg.push({beat:[...ev.beat],x:ev.x});}}
 // 最後に幹の終点で蓋
 if(mainLastSeg)newSeg.push({beat:[...mainLastSeg.beat],x:mainLastSeg.x});
 // 元の折り返し部分（有効範囲外）をそのまま末尾へ
 for(let i=effectiveMainSegs.length;i<mainOriginalSegs.length;i++)
  newSeg.push({beat:[...mainOriginalSegs[i].beat],x:mainOriginalSegs[i].x});

 // [m,0,0] 形式（分母0）を [m,0,1] に正規化しておくと描画/保存が安定
 for(const s of newSeg)if(!s.beat[2])s.beat[2]=1;
 const fixCount=fixDuplicateSegsArr(newSeg);
 mainSlide.seg=newSeg;
 const removeSet=new Set(branches);
 data.note=notes=notes.filter(n=>!removeSet.has(n));
 return fixCount;
}

$('#bBranch').onclick=()=>{
 if(!data){alert('先にMCファイルを読み込んでください');return;}
 if(chainOrder.length<2){toast('「順番に選択」で本体→装飾の順に2本以上選んでください');return;}
 const targetSlides=[];
 for(const nid of chainOrder){const i=idxOf(nid);if(i<0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;targetSlides.push(n);}
 if(targetSlides.length<2){toast('有効なスライドが2本未満です');return;}

 pushUndo();
 // 選択順の1本目が本体。幹は「始点が一番早い」ものとするため、
 // 始点が最も早いスライドを幹として採用（同一なら選択1本目）
 targetSlides.sort((a,b)=>{
  const d=b2f(a.beat)-b2f(b.beat);
  return Math.abs(d)>1e-10?d:0;                 // 同beatなら元の選択順を維持
 });
 const mainSlide=targetSlides[0];
 const branches=targetSlides.slice(1);
 const fixCount=mergeBranchesInto(mainSlide,branches);
 clearChain();sel.clear();rebuildIndex();req();
 toast('✅ 枝分かれ結合: '+targetSlides.length+'本を処理'+(fixCount>0?'（重複 '+fixCount+' 箇所自動修復）':''));
};

/* ===== 「範囲で枝分かれ敷」＝ 本体(判定あり)は「順番に選択」で1本だけ手動指定し、
   装飾は「範囲選択」でまとめて選んだ集合(sel)から、結合する順番にこだわらない前提で自動決定する。
   自動順は装飾の始点beatの昇順。beatが重複する装飾同士は結合順を気にしなくてよいため、
   同beatグループ内だけランダムに並べ替える（Fisher-Yates）。
   ※ mergeBranchesInto側で装飾の挿入位置は結局「本体パス上のどこに刺さるか」で再計算されるため、
     ここでの並び順は主に処理の決定性のためのものであり、既存の「枝分かれ敷」の結果と矛盾しない。 */
$('#bBranchAuto').onclick=()=>{
 if(!data){alert('先にMCファイルを読み込んでください');return;}
 if(chainOrder.length!==1){toast('「順番に選択」で判定を残す本体スライドを1本だけ選んでください');return;}
 const mainNid=chainOrder[0];
 const mainI=idxOf(mainNid);
 const mainSlide=mainI>=0?notes[mainI]:null;
 if(!mainSlide||mainSlide.sound||!mainSlide.seg){toast('本体スライドが見つかりません');return;}

 // 装飾＝範囲選択(sel)から本体自身を除いたもの
 const decoSlides=[];
 for(const nid of sel){if(nid===mainNid)continue;const i=idxOf(nid);if(i<0)continue;
  const n=notes[i];if(!n||n.sound||!n.seg)continue;decoSlides.push(n);}
 if(decoSlides.length<1){toast('「範囲選択」で装飾にするスライドをまとめて選んでください');return;}

 // 始点beat昇順に整列。同beatはランダムに並べる（結合順にこだわらないため）
 const withBeat=decoSlides.map(n=>({n,b:b2f(n.beat)}));
 withBeat.sort((a,b)=>a.b-b.b);
 for(let i=0;i<withBeat.length;){
  let j=i+1;
  while(j<withBeat.length&&Math.abs(withBeat[j].b-withBeat[i].b)<1e-9)j++;
  for(let k=j-1;k>i;k--){const r=i+Math.floor(Math.random()*(k-i+1));
   [withBeat[k],withBeat[r]]=[withBeat[r],withBeat[k]];}
  i=j;
 }
 const orderedDecos=withBeat.map(o=>o.n);

 pushUndo();
 const fixCount=mergeBranchesInto(mainSlide,orderedDecos);
 clearChain();sel.clear();rebuildIndex();req();
 toast('✅ 範囲で枝分かれ結合: 本体+'+orderedDecos.length+'本を処理'+(fixCount>0?'（重複 '+fixCount+' 箇所自動修復）':''));
};

/* ========== 将来プラグイン用API ========== */
window.SlideEditor={get data(){return data},get notes(){return notes},get selection(){return sel},
 rebuild:()=>{rebuildIndex();req()},req,
 b2f,fracBeat,beatToSec,secToBeat};

/* ========== プラグインAPI (MalodyV PluginAPI互換 / Editorテーブル) ========== */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');
 clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('on'),2200);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b?gcd(b,a%b):(a||1);}
function lcm(a,b){return Math.min(2880,Math.abs(a*b)/gcd(a,b))||1;}
function beatPoint(o){return(o.beat||0)+(o.numor||0)/(o.denom||1);}
function makeFracBeat(v,den){den=Math.max(1,Math.round(den));const num=Math.round(v*den);
 return{beat:Math.floor(num/den),numor:mod(num,den),denom:den};}
const arrToBeatObj=a=>({beat:a[0],numor:a[1],denom:a[2]});
const beatObjToArr=o=>[Math.trunc(o.beat)||0,Math.trunc(o.numor)||0,Math.max(1,Math.trunc(o.denom)||1)];
function selArray(){const o={};const a=[...sel];o.Length=a.length;a.forEach((id,i)=>o[i]=id);return o;}
function arrLike(list){const o={};o.Length=list.length;list.forEach((v,i)=>o[i]=v);return o;}
function requireNote(nid){const i=idxOf(nid);if(i<0)throw new Error('無効なnid: '+nid);return{i,n:notes[i]};}

let batchDepth=0,pluginModules=new Map();

function makeEditorAPI(){
 const api={
  GetCurrentTime:()=>(playing?songSec():beatToSec(curBeat))*1000,
  GetSystemTime:()=>Date.now(),
  GetCurrentBeat:()=>arrToBeatObj(fracBeat(curBeat,snapDen)),
  GetCurrentDivide:()=>snapDen,

  GetSelectNotes:()=>selArray(),
  GetNoteCount:()=>notes.reduce((c,n)=>c+(n&&!n.sound?1:0),0),
  GetNoteAt:(index)=>{let c=0;for(const n of notes){if(n&&!n.sound){if(c===index)return nidOf(n);c++;}}return -1;},

  GetNoteTime:(nid,isHead)=>{const{n}=requireNote(nid);const b0=b2f(n.beat);
   let pt=b0;if(!isHead&&n.seg&&n.seg.length)pt=b0+b2f(n.seg[n.seg.length-1].beat);
   return beatToSec(pt)*1000;},
  GetNoteBeat:(nid,isHead)=>{const{n}=requireNote(nid);
   if(isHead||!n.seg||!n.seg.length)return arrToBeatObj(n.beat);
   const last=n.seg[n.seg.length-1];
   return makeFracBeat(b2f(n.beat)+b2f(last.beat),last.beat[2]||snapDen);},
  GetNoteX:(nid)=>requireNote(nid).n.x||0,
  GetNoteWidth:(nid)=>requireNote(nid).n.w||57,
  GetNoteType:(nid)=>requireNote(nid).n.type||0,
  GetNoteFlag:(nid)=>requireNote(nid).n.flag||0,
  GetNoteGroup:(nid)=>requireNote(nid).n.group,
  GetNoteSlideBodyCount:(nid)=>((requireNote(nid).n.seg)||[]).length,
  GetNoteSlideBodyBeat:(nid,index)=>{const seg=requireNote(nid).n.seg;
   if(!seg||!seg[index])throw new Error('segのindexが範囲外です');return arrToBeatObj(seg[index].beat);},
  GetNoteSlideBodyX:(nid,index)=>{const seg=requireNote(nid).n.seg;
   if(!seg||!seg[index])throw new Error('segのindexが範囲外です');return seg[index].x||0;},

  GetClickX:()=>pClickX,
  GetClickBeat:()=>arrToBeatObj(fracBeat(pClickBeat,snapDen)),
  GetClickBeatFree:()=>arrToBeatObj(makeFracBeat(pClickBeat,2880)),

  GetTimeCount:()=>((data&&data.time)||[]).length,
  GetTimeAt:(index)=>{const t=(data&&data.time&&data.time[index]);if(!t)return null;
   return{beat:arrToBeatObj(t.beat),bpm:t.bpm,delay:t.delay||0};},
  GetEffectCount:()=>((data&&data.effect)||[]).length,
  GetEffectAt:(index)=>{const ef=(data&&data.effect&&data.effect[index]);if(!ef)return null;
   return{beat:arrToBeatObj(ef.beat),name:ef.type,value:ef.value};},

  StartBatch:()=>{if(batchDepth===0)pushUndo();batchDepth++;},
  FinishBatch:()=>{batchDepth=Math.max(0,batchDepth-1);if(batchDepth===0){rebuildIndex();req();}},

  AddNote:(type)=>{const n={beat:[0,0,1],x:0,w:57,type:type|0};notes.push(n);
   const id=nidOf(n);idToIdx.set(id,notes.length-1);return id;},
  DeleteNote:(nid)=>{const i=idxOf(nid);if(i<0)return;notes.splice(i,1);sel.delete(nid);rebuildIndex();req();},
  SetNoteBeat:(nid,beatObj,isHead)=>{const{n}=requireNote(nid);
   if(isHead===false){console.warn('SetNoteBeat: isHead=falseは現バージョン未対応（始点のみ設定可）');return;}
   n.beat=beatObjToArr(beatObj);req();},
  SetNoteX:(nid,x)=>{requireNote(nid).n.x=clamp(Math.round(x),0,255);req();},
  SetNoteWidth:(nid,w)=>{requireNote(nid).n.w=Math.max(1,Math.round(w));req();},
  SetNoteFlag:(nid,flag)=>{requireNote(nid).n.flag=flag;req();},
  SetNoteGroup:(nid,group)=>{requireNote(nid).n.group=group;req();},
  SelectNote:(nid)=>{if(nid===-1||nid==null){sel.clear();req();return;}sel.add(nid);req();},

  AddNoteSlideBody:(nid,beatObj)=>{const{n}=requireNote(nid);if(!n.seg)n.seg=[];
   n.seg.push({x:0,beat:beatObjToArr(beatObj)});req();},
  SetNoteSlideBodyX:(nid,index,relX)=>{const seg=requireNote(nid).n.seg;
   if(!seg||!seg[index])throw new Error('segのindexが範囲外です');seg[index].x=Math.round(relX);req();},
  DeleteNoteSlideBody:(nid)=>{delete requireNote(nid).n.seg;req();},

  AddTime:(beatObj,bpm,delay)=>{if(!data)return;if(!data.time)data.time=[];
   data.time.push({beat:beatObjToArr(beatObj),bpm:bpm,delay:delay||0});rebuildBpm();req();},
  DeleteTime:(index)=>{if(data&&data.time)data.time.splice(index,1);rebuildBpm();req();},
  AddEffect:(beatObj,name,value)=>{if(!data)return;if(!data.effect)data.effect=[];
   data.effect.push({beat:beatObjToArr(beatObj),type:name,value:value});req();},
  DeleteEffect:(index)=>{if(data&&data.effect)data.effect.splice(index,1);req();},

  MakeBeat:(b,nu,de)=>({beat:b|0,numor:nu|0,denom:Math.max(1,de|0)}),
  BeatAdd:(a,b)=>makeFracBeat(beatPoint(a)+beatPoint(b),lcm(a.denom||1,b.denom||1)),
  BeatMinus:(a,b)=>makeFracBeat(beatPoint(a)-beatPoint(b),lcm(a.denom||1,b.denom||1)),
  SeekTo:(beatObj)=>{curBeat=viewBeat=beatPoint(beatObj);req();},

  ShowMessage:(text)=>alert(String(text)),
  ShowTip:(text)=>toast(String(text)),
  GetUserInput:(prompt,def,callback)=>{const v=window.prompt(String(prompt),def==null?'':String(def));
   if(v!==null&&typeof callback==='function')callback(v);},
  GetUserSelect:(prompt,options,callback)=>{const list=[];const len=(options&&options.Length)||0;
   for(let k=0;k<len;k++)list.push(options[k]);
   const v=window.prompt(String(prompt)+'\n'+list.map((o,i)=>i+': '+o).join('\n'),'0');
   if(v!==null&&typeof callback==='function')callback(Math.max(0,Math.min(list.length-1,parseInt(v)||0)));},
  GetUserOption:(prompt,callback)=>{const v=window.confirm(String(prompt));
   if(typeof callback==='function')callback(v);},

  CallShortcut:(name)=>{if(name==='undo')undo();else if(name==='redo')redo();
   else if(name==='save')$('#bSave').click();else console.warn('未対応のCallShortcut:',name);},

  FindModule:(id)=>pluginModules.get(id)||null,
  AddSprite:(id,file)=>{const m={Width:32,Height:32,Beat:0,X:128,Alpha:1,HeightBeat:0,Rotate:0,__kind:'sprite',__file:file};
   pluginModules.set(id,m);req();return m;},
  AddText:(id,text)=>{const m={Text:String(text),Beat:0,X:128,Alpha:1,Rotate:0,__kind:'text'};
   pluginModules.set(id,m);req();return m;},
  RemoveModule:(id)=>{pluginModules.delete(id);req();},

  SetGridLine:(divide)=>{snapDen=Math.max(1,Math.round(divide));
   const s2=$('#sSnap');let found=false;
   for(const o of s2.options)if(+o.value===snapDen){o.selected=true;found=true;}
   if(!found){const o=document.createElement('option');o.value=snapDen;o.textContent='1/'+snapDen;o.selected=true;s2.appendChild(o);}
   req();},

  WriteFilePlugin:(filename,content)=>{const blob=new Blob([content],{type:'application/octet-stream'});
   downloadBlob(blob,String(filename));},
  WriteChartCustom:(filename)=>{const blob=new Blob([JSON.stringify(data)],{type:'application/octet-stream'});
   downloadBlob(blob,String(filename||(baseName+'_custom.mc')));},
  ReadFileSelect:(prompt,callback)=>{const inp=document.createElement('input');inp.type='file';
   inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{if(typeof callback==='function')callback(r.result);};r.readAsText(f);};
   inp.click();},
  ReadBytesSelect:(prompt,callback)=>{const inp=document.createElement('input');inp.type='file';
   inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const bytes=new Uint8Array(r.result);
     if(typeof callback==='function')callback(arrLike(Array.from(bytes)));};
    r.readAsArrayBuffer(f);};
   inp.click();},
  ReadData:(key)=>localStorage.getItem('plugin_data:'+key),
  WriteData:(key,value)=>{localStorage.setItem('plugin_data:'+key,String(value));},
 };
 api.AddSpriteUndo=(id,file)=>api.AddSprite(id,file);
 api.AddTextUndo=(id,text)=>api.AddText(id,text);
 api.RemoveSpriteUndo=(id)=>api.RemoveModule(id);
 return api;
}

/* ===== Lua実行(Fengari) ===== */
let activeL=null;
function callLua(L,name,...args){const{lua,interop}=fengari;
 lua.lua_getglobal(L,name);
 if(lua.lua_isnil(L,-1)){lua.lua_pop(L,1);return;}
 args.forEach(a=>interop.push(L,a));
 if(lua.lua_pcall(L,args.length,0,0)!==lua.LUA_OK){
  const err=lua.lua_tojsstring(L,-1);lua.lua_pop(L,1);console.error(err);toast('プラグインエラー: '+err);}}

function runPlugin(code,header){
 if(typeof fengari==='undefined'){alert('Lua実行エンジン(Fengari)の読み込みに失敗しました。通信環境をご確認ください。');return;}
 if(!data){alert('先にMCファイルを読み込んでください');return;}
 const{lua,lauxlib,lualib,interop,to_luastring}=fengari;
 const L=lauxlib.luaL_newstate();lualib.luaL_openlibs(L);
 try{
  const api=makeEditorAPI();
  interop.push(L,api);lua.lua_setglobal(L,'Editor');
  if(lauxlib.luaL_dostring(L,to_luastring(code))!==lua.LUA_OK){
   const err=lua.lua_tojsstring(L,-1);alert('プラグイン読み込みエラー:\n'+err);return;}
  if(+header.type===2){
   if(activeL)callLua(activeL,'OnDeactive');
   activeL=L;tool='plugin';
   document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));
   callLua(L,'OnActive');toast(header.name+' を有効化：キャンバスをドラッグ/タップで操作');
  }else{
   callLua(L,'Run');
  }
 }catch(err){alert('プラグイン実行エラー:\n'+err.message);}
}

/* ===== プラグイン管理UI ===== */
let plugins=[];
function extractHeader(code){
 const g=re=>{const m=code.match(re);return m?m[1]:null;};
 return{
  name:g(/PluginName\s*=\s*['"]([^'"]*)['"]/)||'(無題プラグイン)',
  mode:g(/PluginMode\s*=\s*(\d+)/)||'?',
  type:g(/PluginType\s*=\s*(\d+)/)||'0',
  require:g(/PluginRequire\s*=\s*['"]([^'"]*)['"]/)||'-'
 };}
function loadPluginsFromStorage(){try{plugins=JSON.parse(localStorage.getItem('slideEditor_plugins')||'[]');}
 catch(e){plugins=[];}renderPluginList();}
function savePluginsToStorage(){localStorage.setItem('slideEditor_plugins',JSON.stringify(plugins));}
function renderPluginList(){
 const list=$('#pList');list.innerHTML='';
 if(!plugins.length){list.innerHTML='<div id="pEmpty">まだ読み込まれていません</div>';return;}
 plugins.forEach((p,idx)=>{
  const h=extractHeader(p.code);
  const el=document.createElement('div');el.className='pItem';
  el.innerHTML='<div class="pName"></div><div class="pMeta"></div>'+
   '<div class="pBtns"><button class="run">実行</button><button class="del">削除</button></div>';
  el.querySelector('.pName').textContent=h.name;
  el.querySelector('.pMeta').textContent='mode:'+h.mode+' type:'+(h.type==='2'?'インタラクティブ':'即実行')+' req:'+h.require;
  el.querySelector('.run').onclick=()=>runPlugin(p.code,h);
  el.querySelector('.del').onclick=()=>{plugins.splice(idx,1);savePluginsToStorage();renderPluginList();};
  list.appendChild(el);});}
$('#fPlugin').addEventListener('change',e=>{
 const files=[...e.target.files];if(!files.length)return;let remain=files.length;
 files.forEach(f=>{const r=new FileReader();
  r.onload=()=>{plugins.push({fname:f.name,code:r.result});
   if(--remain===0){savePluginsToStorage();renderPluginList();}};
  r.readAsText(f);});
 e.target.value='';});
$('#bPlugin').onclick=()=>$('#panel').classList.toggle('on');
$('#pClose').onclick=()=>$('#panel').classList.remove('on');

resize();req();loadPluginsFromStorage();
</script>
