<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Slide Editor Web (prototype)</title><style>html,body{height:100%;margin:0;overflow:hidden;background:#151520;color:#ddd;font:14px system-ui;-webkit-user-select:none;user-select:none}body{display:flex;flex-direction:column}#bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#20202e;align-items:center;z-index:2}#bar button,#bar select,#bar label{background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}#bar button.on{background:#4a7ba8;border-color:#7db4e8}#bar button.chainOn{background:#a87b4a;border-color:#e8b47d}#bar input[type=file]{display:none}#bar label.file{background:#3a6ea5;border-color:#7db4e8}#cv{flex:1;touch-action:none;background:#1a1a25}#barW{width:60px;background:#252535}#time{font:11px monospace;color:#9cf;padding:0 4px}input[type=number]{width:64px;background:#2c2c3d;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px}#panel{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:82vw;background:#1b1b26;border-left:1px solid #333;transform:translateX(100%);transition:transform .18s;z-index:5;display:flex;flex-direction:column;overflow:hidden}#panel.on{transform:translateX(0)}#panel h3{margin:0;padding:10px;font-size:13px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}.pItem{padding:8px;border-bottom:1px solid #2a2a3a}.pName{font-weight:600;color:#9cf;font-size:12px}.pMeta{font-size:10px;color:#888;margin:2px 0 4px}.pBtns{display:flex;gap:4px}.pItem button{flex:1;padding:4px;font-size:11px;border-radius:4px;border:1px solid #555;cursor:pointer}.pItem button.run{background:#3a6ea5;border-color:#7db4e8;color:#fff}.pItem button.del{background:#6b2f2f;border-color:#9d4f4f}#pLoad{display:block;width:100%;padding:8px;margin:6px 0;text-align:center;background:#3a6ea5;border:1px solid #7db4e8;border-radius:6px;font-size:12px}#pEmpty{color:#777;font-size:11px;padding:10px;text-align:center}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}</style></head><body><div id="bar"><label class="file">MC<input type="file" id="fMc" accept=".mc,.json,.txt"></label><label class="file">Audio<input type="file" id="fAu" accept="audio/*"></label><button id="bSave">保存</button><button id="bPlay">▶</button><button id="bStop">■</button><button id="bHere">_here</button><span id="time">--:--</span><select id="sSnap"></select><button id="zIn">+</button><button id="zOut">−</button><button data-t="move">移動</button><button data-t="box">範囲</button><button data-t="chain">順番に選択</button><button id="bDelSel">選択削除</button><button id="bClear">選択解除</button><button id="bJoin">間隔を保つ</button><select id="sJoinMode"><option value="keep">間隔を保つ</option><option value="pack">間隔を詰める</option></select><button id="bBranch">枝分かれ敷</button><button id="bChainClr">順番リセット</button><button id="bUndo">⟲</button><button id="bRedo">⟳</button><button data-t="plugin">off</button><button id="bPlugPanel">🔌プラグイン</button></div><canvas id="cv"></canvas><div id="panel"><h3>プラグイン<button id="pClose">✕</button></h3><div id="pList"></div><input type="file" id="pLoad" accept=".lua"></div><div id="toast"></div><script>'use strict';/* ===== DOM ===== */const $=s=>document.querySelector(s);const cv=$('#cv'),ctx=cv.getContext('2d');let W,H,DPR=1;/* ===== 状態 ===== */let viewBeat=0,ppb=40,snapDen=4;let barW=52,trackL,trackW,playY;let offsetMs=0;let playing=false,ac=null,buffer=null,srcNode=null,startTime=0,curBeat=0;let mini=null,mctx=null,totalBeats=1;const ac=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext));let tool='move';let navS=null,panS=null,pinchS=null,segS=null,dragS=null,boxS=null,togPend=null,downI=null;let pointers=new Map();let pClickX=128,pClickBeat=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}/* ===== ノーツ管理 ===== */let nmin=new Float64Array(0),nmax=new Float64Array(0);let data=null,notes=[],starts=new Float64Array(0),order=[];let sel=new Set(),baseName='chart';let chainOrder=[],chainOrderSet=new Set();let dirty=true,rafPend=false;let noteId=new WeakMap(),nextNid=1,idToIdx=new Map();function nidOf(n){let id=noteId.get(n);if(id==null){id=nextNid++;noteId.set(n,id);}return id;}function idxOf(nid){return idToIdx.has(nid)?idToIdx.get(nid):-1;}/* ===== undo/redo ===== */let undoStack=[],redoStack=[];const snap=()=>JSON.stringify(notes);function pushUndo(){undoStack.push(snap());if(undoStack.length>30)undoStack.shift();redoStack.length=0;}function undo(){if(!undoStack.length||!data)return;redoStack.push(snap());notes=JSON.parse(undoStack.pop());data.note=notes;sel.clear();chainOrder.length=0;chainOrderSet.clear();rebuildIndex();req();}function redo(){if(!redoStack.length||!data)return;undoStack.push(snap());notes=JSON.parse(redoStack.pop());data.note=notes;sel.clear();chainOrder.length=0;chainOrderSet.clear();rebuildIndex();req();}$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if(k==='y'){e.preventDefault();redo();}});/* ========== 座標変換 ========== */const x2px=x=>trackL+x/255*trackW;const px2x=p=>(p-trackL)/trackW*255;const b2y=b=>playY-(b-viewBeat)*ppb;const y2b=y=>viewBeat+(playY-y)/ppb;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);trackL=barW+8;trackW=W-trackL-8;playY=H*0.62;buildMini();req();}addEventListener('resize',resize);/* ========== BPM / 時刻 ========== */let bpmL=[];function rebuildBpm(){bpmL.length=0;for(const e of(data?data.time:[])){bpmL.push({beat:b2f(e.beat),bpm:e.bpm,delay:e.delay||0});}bpmL.sort((a,b)=>a.beat-b.beat);}function b2f(b){if(!Array.isArray(b))return 0;return b[0]+(b[1]||0)/(b[2]||1);}function beatToSec(b){rebuildBpm();let t=0,cur=0,bpm=120;for(const e of bpmL){if(e.beat>b)break;t+=(e.beat-cur)/bpm*60+(e.delay||0)/1000;cur=e.beat;bpm=e.bpm;}t+=(b-cur)/bpm*60;return t;}function secToBeat(s){rebuildBpm();let t=0,cur=0,bpm=120;for(const e of bpmL){const dt=(e.beat-cur)/bpm*60+(e.delay||0)/1000;if(t+dt>s)break;t+=dt;cur=e.beat;bpm=e.bpm;}return cur+(s-t)/60*bpm;}/* ===== index ===== */function rebuildIndex(){const m=notes.length;nmin=new Float64Array(m);nmax=new Float64Array(m);order.length=0;idToIdx.clear();for(let i=0;i<m;i++){const n=notes[i];if(!n){nmin[i]=1e18;nmax[i]=1e18;continue;}idToIdx.set(nidOf(n),i);if(n.sound){nmin[i]=1e18;nmax[i]=1e18;continue;}const b=b2f(n.beat);let mn=b,mx=b;if(n.seg)for(const s of n.seg){const sb=b+b2f(s.beat);if(sb<mn)mn=sb;if(sb>mx)mx=sb;}nmin[i]=mn;nmax[i]=mx;order.push(i);}order.sort((a,b)=>nmin[a]-nmin[b]);buildMini();}function upperBound(t){let a=0,b=order.length;while(a<b){const m=(a+b)>>1;if(nmin[order[m]]<=t)a=m+1;else b=m;}return a;}/* ===== ミニマップ ===== */function buildMini(){if(!data||H<10)return;if(!mini){mini=document.createElement('canvas');mctx=mini.getContext('2d');}mini.width=barW*DPR;mini.height=H*DPR;mctx.setTransform(DPR,0,0,DPR,0,0);let tb=1;for(let i=0;i<notes.length;i++)if(!notes[i].sound&&nmax[i]>tb)tb=nmax[i];totalBeats=tb;mctx.fillStyle='#20202e';mctx.fillRect(0,0,barW,H);for(let i=0;i<notes.length;i++){const n=notes[i];if(!n||n.sound)continue;mctx.fillStyle=n.type===4?'#e6cf3f':(n.seg?'#8fd0f0':'#ddd');const y1=(1-nmin[i]/totalBeats)*H,y2=(1-nmax[i]/totalBeats)*H;mctx.fillRect(2,y2,barW-4,Math.max(1,y1-y2));}}function drawMini(){if(!mini)return;ctx.drawImage(mini,0,0,barW,H);ctx.fillStyle='#333';ctx.fillRect(barW,0,2,H);}/* ===== グリッド ===== */function drawGrid(){ctx.strokeStyle='#2a2a3a';ctx.lineWidth=1;const b0=Math.floor(viewBeat),b1=Math.ceil(viewBeat+H/ppb);for(let b=b0;b<=b1;b++){const y=b2y(b);ctx.beginPath();ctx.moveTo(trackL,y);ctx.lineTo(W,y);ctx.stroke();}ctx.strokeStyle='#444';for(let b=b0;b<=b1;b++){if(b%4!==0)continue;const y=b2y(b);ctx.beginPath();ctx.moveTo(trackL,y);ctx.lineTo(W,y);ctx.stroke();}}/* ===== 描画 ===== */function segPts(n,b0){const p=[{px:x2px(n.x),py:b2y(b0)}];if(n.seg)for(const s of n.seg)p.push({px:x2px(n.x+(s.x??0)),py:b2y(b0+b2f(s.beat))});return p;}function drawRibbonStroke(n,b0){const pts=segPts(n,b0);if(pts.length<2)return;const hw=Math.max(8,(n.w||8)/255*trackW/2);ctx.beginPath();for(let i=0;i<pts.length-1;i++){const p1=pts[i],p2=pts[i+1];ctx.moveTo(p1.px-hw,p1.py);ctx.lineTo(p1.px+hw,p1.py);ctx.lineTo(p2.px+hw,p2.py);ctx.lineTo(p2.px-hw,p2.py);ctx.closePath();}ctx.stroke();}function drawNote(i){const n=notes[i];if(!n||n.sound)return;const b=b2f(n.beat);const y=b2y(b);const px=x2px(n.x);const selected=sel.has(nidOf(n));ctx.fillStyle=n.type===4?'#e6cf3f':(n.seg?'#8fd0f0':'#ddd');if(selected)ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.arc(px,y,6,0,Math.PI*2);ctx.fill();if(n.seg){const pts=segPts(n,b);ctx.strokeStyle=selected?'rgba(255,107,157,.6)':'rgba(143,208,240,.4)';ctx.lineWidth=Math.max(2,(n.w||8)/255*trackW);ctx.beginPath();ctx.moveTo(pts[0].px,pts[0].py);for(let j=1;j<pts.length;j++)ctx.lineTo(pts[j].px,pts[j].py);ctx.stroke();ctx.fillStyle='#fff';for(let j=1;j<pts.length;j++){ctx.beginPath();ctx.arc(pts[j].px,pts[j].py,4,0,Math.PI*2);ctx.fill();}}}/* ===== hit ===== */function hitNote(px,py){for(let k=upperBound(y2b(py)+1)-1;k>=0;k--){const i=order[k];if(nmax[i]<y2b(py)-1)break;const n=notes[i];if(!n||n.sound)continue;const b=b2f(n.beat);const np={x:x2px(n.x),y:b2y(b)};if(Math.hypot(px-np.x,py-np.y)<12)return{i,seg:null};if(n.seg){const pts=segPts(n,b);for(let j=1;j<pts.length;j++){if(Math.hypot(px-pts[j].px,py-pts[j].py)<10)return{i,seg:j-1};}}}return null;}/* ===== render ===== */function req(){if(!rafPend){rafPend=true;requestAnimationFrame(()=>{rafPend=false;render();});}}function render(){ctx.clearRect(0,0,W,H);drawMini();drawGrid();if(data){const v0=y2b(H),v1=y2b(0),hi=upperBound(v1);for(let k=0;k<hi;k++){const i=order[k];if(nmax[i]<v0)continue;drawNote(i);}ctx.strokeStyle='rgba(140,220,255,.9)';ctx.lineWidth=1.5;for(let k=0;k<hi;k++){const i=order[k];if(nmax[i]>=v0&&notes[i]&&sel.has(nidOf(notes[i]))&&notes[i].seg)drawRibbonStroke(notes[i],b2f(notes[i].beat));}}drawPlayline();}function drawPlayline(){const y=b2y(viewBeat);ctx.strokeStyle='#9cf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(trackL,y);ctx.lineTo(W,y);ctx.stroke();}/* ===== file ===== */$('#fMc').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;baseName=f.name.replace(/\.[^.]+$/,'');const r=new FileReader();r.onload=()=>{data=JSON.parse(r.result);notes=data.note||(data.note=[]);/* === 修正: xキーが無いsegをx:0に正規化 === */for(const n of notes){if(n&&n.seg)for(const s of n.seg){if(s.x==null)s.x=0;}}rebuildIndex();sel.clear();chainOrder.length=0;chainOrderSet.clear();const first=notes.find(n=>n&&!n.sound);viewBeat=curBeat=first?b2f(first.beat):0;req();};r.readAsText(f);});$('#fAu').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>ac().decodeAudioData(r.result).then(b=>{buffer=b;}).catch(()=>alert('デコード失敗'));r.readAsArrayBuffer(f);});function downloadBlob(blob,filename){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(a.href);},5000);}$('#bSave').onclick=()=>{if(!data){alert('先にMCファイルを読み込んでください');return;}const blob=new Blob([JSON.stringify(data)],{type:'application/octet-stream'});downloadBlob(blob,baseName+'.mc');};/* ========== UI ========== */$('#bPlay').onclick=()=>{playing?pause():play();};$('#bStop').onclick=stopPlay;$('#bHere').onclick=()=>{viewBeat=curBeat;req();};$('#zIn').onclick=()=>{ppb=clamp(ppb*1.25,6,500);req();};$('#zOut').onclick=()=>{ppb=clamp(ppb/1.25,6,500);req();};$('#bDelSel').onclick=deleteSel;$('#bClear').onclick=()=>{sel.clear();req();};function deleteSel(){if(!sel.size)return;pushUndo();notes=notes.filter(n=>!sel.has(nidOf(n)));data.note=notes;sel.clear();rebuildIndex();req();}/* ===== play ===== */function play(){if(!buffer)return;srcNode=ac().createBufferSource();srcNode.buffer=buffer;srcNode.connect(ac().destination);startTime=ac().currentTime;srcNode.start(0,beatToSec(curBeat));playing=true;updateTime();}function pause(){if(srcNode)srcNode.stop();playing=false;}function stopPlay(){if(srcNode)srcNode.stop();playing=false;curBeat=viewBeat;}function updateTime(){if(!playing)return;curBeat=secToBeat(ac().currentTime-startTime+beatToSec(viewBeat));$('#time').textContent=curBeat.toFixed(2);requestAnimationFrame(updateTime);}/* ===== pointer ===== */cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);pointers.set(e.pointerId,p);if(pointers.size>=2){const ps=[...pointers.values()];pinchS={ppb,my:(ps[0].y+ps[1].y)/2,d:dist(ps[0],ps[1]),vb:viewBeat};return;}downI={p,moved:false};if(p.x<barW){navS=1;return;}if(tool==='move'){panS={p,vb:viewBeat};return;}if(tool==='box'){const h=hitNote(p.x,p.y);if(h){const nid=nidOf(notes[h.i]);const was=sel.has(nid);if(!was)sel.add(nid);togPend={nid,was};dragS={p,pushed:false};return;}boxS={x:p.x,y:p.y};return;}});cv.addEventListener('pointermove',e=>{const p=pos(e);if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);if(pinchS&&pointers.size>=2){const ps=[...pointers.values()];ppb=clamp(pinchS.ppb*dist(ps[0],ps[1])/pinchS.d,6,500);viewBeat=pinchS.vb+(pinchS.my-(ps[0].y+ps[1].y)/2)/ppb;req();return;}if(!downI)return;if(Math.abs(p.x-downI.p.x)+Math.abs(p.y-downI.p.y)>6)downI.moved=true;if(navS){viewBeat=y2b(p.y);req();return;}if(boxS){boxS.x1=p.x;boxS.y1=p.y;req();return;}if(dragS&&downI.moved){if(!dragS.pushed){pushUndo();dragS.pushed=true;}const db=y2b(p.y)-y2b(dragS.p.y);for(const nid of sel){const i=idxOf(nid);if(i<0)continue;const n=notes[i];n.beat=[Math.max(0,Math.round((b2f(n.beat)+db)*snapDen)/snapDen),0,1];}req();return;}if(panS){viewBeat=panS.vb+(panS.p.y-p.y)/ppb;req();return;}});function up(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchS=null;if(!downI)return;if(boxS&&boxS.x1!=null){const x0=Math.min(boxS.x,boxS.x1),x1=Math.max(boxS.x,boxS.x1);const bT=y2b(Math.min(boxS.y,boxS.y1)),bB=y2b(Math.max(boxS.y,boxS.y1));for(let i=0;i<notes.length;i++){const n=notes[i];if(!n||n.sound)continue;const b=b2f(n.beat);if(b<bB||b>bT)continue;const px=x2px(n.x);if(px>=x0&&px<=x1)sel.add(nidOf(n));}}if(downI&&!downI.moved&&togPend&&togPend.was)sel.delete(togPend.nid);togPend=null;dragS=panS=boxS=downI=null;req();}cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey)ppb=clamp(ppb*Math.exp(-e.deltaY*0.01),6,500);else viewBeat+=e.deltaY*0.02;req();},{passive:false});/* ===== snap ===== */for(const d of[1,2,3,4,6,8,12,16,24,48,96,288]){const o=document.createElement('option');o.value=d;o.textContent='1/'+d;if(d===4)o.selected=true;$('#sSnap').appendChild(o);}$('#sSnap').onchange=e=>snapDen=+e.target.value;/* ===== 折り返し敷 ===== */$('#bJoin').onclick=()=>{if(!data||chainOrder.length<1)return;const targetSlides=[];for(const nid of chainOrder){const i=idxOf(nid);if(i<0)continue;const n=notes[i];if(!n||n.sound||!n.seg)continue;targetSlides.push(n);}if(targetSlides.length<1)return;pushUndo();const mainSlide=targetSlides[0];const mainX=mainSlide.x??0;const mainBeat=mainSlide.beat;const newSeg=[];for(let i=0;i<targetSlides.length;i++){const slide=targetSlides[i],segs=slide.seg;const curX=slide.x??0;const offsetX=curX-mainX;const baseBeat=[0,0,1];if(i%2===0){if(i>0)newSeg.push({beat:[...baseBeat],x:offsetX});for(let j=0;j<segs.length;j++){let segItem=JSON.parse(JSON.stringify(segs[j]));segItem.x=(segItem.x??0)+offsetX;newSeg.push(segItem);}}else{for(let j=segs.length-1;j>=0;j--){let segItem=JSON.parse(JSON.stringify(segs[j]));segItem.x=(segItem.x??0)+offsetX;newSeg.push(segItem);}newSeg.push({beat:[...baseBeat],x:offsetX});}}mainSlide.seg=newSeg;const removeSet=new Set(targetSlides.slice(1));data.note=notes=notes.filter(n=>!removeSet.has(n));clearChain();sel.clear();rebuildIndex();req();toast('✅ 結合完了');};/* ===== 枝分かれ敷 ===== */$('#bBranch').onclick=()=>{if(!data||chainOrder.length<2)return;const targetSlides=[];for(const nid of chainOrder){const i=idxOf(nid);if(i<0)continue;const n=notes[i];if(!n||n.sound||!n.seg)continue;targetSlides.push(n);}if(targetSlides.length<2)return;pushUndo();targetSlides.sort((a,b)=>b2f(a.beat)-b2f(b.beat));const mainSlide=targetSlides[0];const mainX=mainSlide.x??0;const mainPoints=[{point:0,relX:0}];for(const s of(mainSlide.seg||[]))mainPoints.push({point:b2f(s.beat),relX:(s.x??0)});const branches=targetSlides.slice(1);const newSeg=[...mainSlide.seg];for(const br of branches){const brSegs=br.seg||[];for(const s of brSegs){const relX=getRelXAtArr(mainPoints,b2f(s.beat));newSeg.push({beat:[...s.beat],x:relX+(s.x??0)});}}mainSlide.seg=newSeg;const removeSet=new Set(branches);data.note=notes=notes.filter(n=>!removeSet.has(n));clearChain();sel.clear();rebuildIndex();req();toast('✅ 枝分かれ結合完了');};function getRelXAtArr(mainPoints,targetPoint){if(mainPoints.length===1)return mainPoints[0].relX;if(targetPoint<=mainPoints[0].point)return mainPoints[0].relX;if(targetPoint>=mainPoints[mainPoints.length-1].point)return mainPoints[mainPoints.length-1].relX;for(let i=0;i<mainPoints.length-1;i++){if(targetPoint>=mainPoints[i].point&&targetPoint<=mainPoints[i+1].point){const t=(targetPoint-mainPoints[i].point)/(mainPoints[i+1].point-mainPoints[i].point);return mainPoints[i].relX+(mainPoints[i+1].relX-mainPoints[i].relX)*t;}}return 0;}function clearChain(){chainOrder.length=0;chainOrderSet.clear();req();}$('#bChainClr').onclick=()=>{clearChain();toast('順番選択をリセットしました');};/* ===== chain ===== */$('#bChain').onclick=()=>{tool='chain';document.querySelectorAll('[data-t]').forEach(x=>{x.classList.toggle('on',x===b&&x.dataset.t!=='chain');x.classList.toggle('chainOn',x===b&&x.dataset.t==='chain');});};/* ===== toast ===== */function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('on'),2200);}/* ===== init ===== */for(const b of document.querySelectorAll('[data-t]'))b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>{x.classList.toggle('on',x===b&&x.dataset.t!=='chain');x.classList.toggle('chainOn',x===b&&x.dataset.t==='chain');});req();};resize();</script></body></html>
