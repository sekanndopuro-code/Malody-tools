<script>
"use strict";
/* ===== 定数 ===== */
const WIN={best:36,cool:76,good:110,miss:150}, ACCW={BEST:100,COOL:75,GOOD:40,MISS:0};
const STEP=1000/60, TICK=100, AUTO=-999, INPUT_SLOP=2.5, SLIDE_TRAIL_MS=260;
const SLIDE_TAIL_FREE_MS=200, SLIDE_BUF_SIZE=20, SLIDE_HANDOFF_GRACE_MS=120;
const cfg={tOff:0,speed:1,lead:1400,auto:false,eff:true,suck:true,startC:false,dbg:false};
/* ===== 譜面パース ===== */
const beatF=b=>b[0]+b[1]/(b[2]||1), beatStr=b=>b[2]===1?`${b[0]}`:`${b[0]}+${b[1]}/${b[2]}`;
function buildTiming(a){const evs=(a||[]).filter(t=>t.bpm!==undefined)
.map(t=>({b:beatF(t.beat),bpm:t.bpm})).sort((x,y)=>x.b-y.b);
if(!evs.length)evs.push({b:0,bpm:120}); const ms=[0];
for(let i=0;i<evs.length;i++)if(i+1<evs.length)ms.push(ms[i]+(evs[i+1].b-evs[i].b)*60000/evs[i].bpm);
return{evs,ms};}
function bpmAtBeat(tm,b){const e=tm.evs;let lo=0,hi=e.length-1;
while(lo<hi){const m=(lo+hi+1)>>1;if(e[m].b<=b)lo=m;else hi=m-1;}return e[lo].bpm;}
function beatToMs(tm,b){const{evs,ms}=tm; if(b<=evs[0].b)return ms[0]+(b-evs[0].b)*60000/evs[0].bpm;
let lo=0,hi=evs.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(evs[m].b<=b)lo=m;else hi=m-1;}
return ms[lo]+(b-evs[lo].b)*60000/evs[lo].bpm;}
function msToBeat(tm,t){const{evs,ms}=tm; if(t<=ms[0])return evs[0].b+(t-ms[0])*evs[0].bpm/60000;
let lo=0,hi=evs.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(ms[m]<=t)lo=m;else hi=m-1;}
return evs[lo].b+(t-ms[lo])*evs[lo].bpm/60000;}
function buildEffect(a,tm){const evs=(a||[]).map(e=>({b:beatF(e.beat),scroll:e.scroll,jump:e.jump}))
.sort((x,y)=>x.b-y.b); const eb=[],ebase=[],ecur=[]; let cur=1,prev=0,pos=0;
for(const ev of evs){const p=pos+cur*(ev.b-prev);
const j=p+(ev.jump!==undefined?ev.jump*bpmAtBeat(tm,ev.b)/60000:0);
eb.push(ev.b);ebase.push(j); if(ev.scroll!==undefined)cur=ev.scroll; ecur.push(cur); prev=ev.b;pos=j;}
return{eb,ebase,ecur};}
function chartPosAtBeat(eff,b){if(!eff.eb.length)return b; if(b<=eff.eb[0])return b;
let lo=0,hi=eff.eb.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(eff.eb[m]<=b)lo=m;else hi=m-1;}
return eff.ebase[lo]+eff.ecur[lo]*(b-eff.eb[lo]);}
function readChartOffset(json){
  /* Canonical meaning in this player:
   *   chartTime = audioTime + chartOffset
   * The file value is kept untouched and applied only at the audio->chart
   * conversion boundary.  This avoids offset being baked into note.t. */
  const direct=[json?.offset,json?.meta?.offset,json?.mode_ext?.offset];
  for(const v of direct) if(Number.isFinite(Number(v))) return Number(v);
  for(const n of (json?.note||[])) if(Number.isFinite(Number(n?.offset))) return Number(n.offset);
  return 0;
}
function buildChart(json){
const tm=buildTiming(json.time),eff=buildEffect(json.effect,tm),cAt=b=>chartPosAtBeat(eff,b);
const chartOffset=readChartOffset(json),tAt=b=>beatToMs(tm,b);
const taps=[],wipes=[],slides=[];
for(const n of(json.note||[])){ if(n.type===1)continue;
const b=beatF(n.beat),t=tAt(b),x=n.x??128,w=n.w??64;
if(n.seg&&n.seg.length){
const nT=[t],nX=[x],nC=[cAt(b)],nW=[w]; let cw=w;
for(const s of n.seg){ if(s.w!==undefined)cw=s.w; const sb=b+beatF(s.beat);
nT.push(tAt(sb)); nX.push(x+(s.x||0)); nC.push(cAt(sb)); nW.push(cw); }
slides.push({id:slides.length,t0:t,end:nT[nT.length-1],w,bs:beatStr(n.beat),nT,nX,nC,nW,
state:'pending',ptr:-1,followX:0,noOwnerSince:0,nextTick:0,ticks:0,
cp:[],cpIndex:0,cpInit:false,trail:[],startedCombo:false,
headJudged:false,headTier:null,bodyFailed:false,
buf:[],bufSum:0,avgErr:0,avgOk:false,everOk:false,lastOkTv:0,
finalized:false,success:false});
} else if(n.type===4) wipes.push({t,x,w,bs:beatStr(n.beat),c:cAt(b),state:'pending',ptr:-1,entryErr:0});
else taps.push({t,x,w,bs:beatStr(n.beat),c:cAt(b),state:0});
}
taps.sort((a,b)=>a.t-b.t);wipes.sort((a,b)=>a.t-b.t);slides.sort((a,b)=>a.t0-b.t0);
slides.forEach((s,i)=>s.id=i);
const last=Math.max(0,...taps.map(n=>n.t),...wipes.map(n=>n.t),...slides.map(s=>s.end));
return{tm,eff,taps,wipes,slides,last,mainBpm:tm.evs[0].bpm,chartOffset};}
/* ===== 時計 ===== */
const clock={
  ctx:null,src:null,buf:null,state:'stopped',
  baseAudioMs:0,baseCtxTime:0,
  chartOffsetMs:0,
  perfToCtxMs:0,
  runPerfStart:0,
  runCtxStart:0,
  timingSource:'currentTime',
  init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();},
  setChartOffset(ms){this.chartOffsetMs=Number(ms)||0;},
  refreshMapping(){
    if(!this.ctx)return;
    this.perfToCtxMs=this.ctx.currentTime*1000-performance.now();
  },
  performanceToContextMs(perfMs){
    if(this.runPerfStart>0){
      return this.runCtxStart+(perfMs-this.runPerfStart)/1000;
    }
    this.refreshMapping();
    return (perfMs+this.perfToCtxMs)/1000;
  },
  play(fromAudioMs){
    if(!this.buf)return;
    this.kill();
    this.ctx.resume();
    this.refreshMapping();
    const lead=0.06;
    const nowCtx=this.ctx.currentTime;
    const startCtx=nowCtx+lead;
    const startPerf=performance.now()+lead*1000;
    const s=this.ctx.createBufferSource();
    s.buffer=this.buf;
    s.connect(this.ctx.destination);
    s.start(startCtx,Math.max(0,fromAudioMs)/1000);
    this.src=s;
    this.baseAudioMs=Math.max(0,fromAudioMs);
    this.baseCtxTime=startCtx;
    this.runCtxStart=startCtx;
    this.runPerfStart=startPerf;
    this.state='playing';
  },
  kill(){if(this.src){try{this.src.stop()}catch(e){}this.src.disconnect();this.src=null;}},
  pause(){if(this.state!=='playing')return;this.baseAudioMs=this.audioMs();this.kill();this.state='paused';this.runPerfStart=0;this.runCtxStart=0;},
  resume(){if(this.state==='paused'){this.ctx.resume();this.play(this.baseAudioMs);}},
  audioMs(){
    if(this.state!=='playing')return this.baseAudioMs;
    return Math.max(this.baseAudioMs,this.baseAudioMs+(this.ctx.currentTime-this.baseCtxTime)*1000);
  },
  chartMs(){return this.audioMs()+this.chartOffsetMs;},
  eventAudioMs(perfMs){
    const ctxAtEvent=this.performanceToContextMs(perfMs);
    return this.baseAudioMs+(ctxAtEvent-this.baseCtxTime)*1000;
  },
  eventChartMs(perfMs){return this.eventAudioMs(perfMs)+this.chartOffsetMs;},
  bufferEndChartMs(){return this.chartOffsetMs+(this.buf?this.buf.duration*1000:0)}
};
/* ===== iOS/Safari 音声アンロック =====
 * SafariはAudioContextの「生成」が同期的なユーザー操作の呼び出しスタック内で
 * 行われないと、その後どれだけresume()しても再生が始まらない(currentTimeが
 * 進まない)ことがある。ファイル選択→arrayBuffer().then()の中でinit()すると
 * 非同期コールバック内での生成になってしまうため、ページに触れた最初の瞬間に
 * 同期的にAudioContextを生成し、無音バッファを鳴らして確実にアンロックする。 */
let audioUnlocked=false;
function unlockAudioContext(){
  if(audioUnlocked)return;
  clock.init();
  const c=clock.ctx;
  try{const b=c.createBuffer(1,1,22050);const s=c.createBufferSource();
  s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}
  const p=c.resume();
  if(p&&typeof p.then==='function')p.catch(()=>{});
  audioUnlocked=true;
}
addEventListener('touchstart',unlockAudioContext,{once:true,passive:true});
addEventListener('pointerdown',unlockAudioContext,{once:true,passive:true});
addEventListener('click',unlockAudioContext,{once:true,passive:true});
/* ===== 入力 ===== */
const pointers=new Map(); let queue=[];
const rawTouches=new Map(); /* id -> {x,y}: ブラウザから見て「今まさに触れている」生の状態をそのまま反映(判定・ゲーム状態とは無関係、遅延なし) */
let dbgTs=null; /* eventPerfMsのタイムスタンプ解釈を可視化するためのデバッグ情報 */
/* ===== 入力診断: Safari側の生イベント欠落と、アプリ側のロジック欠落を切り分けるための計測 =====
 * realEvt: ブラウザが実際に発火した touchstart/move/end/cancel の回数(合成イベントは含まない)
 * synthDown/synthUp: syncTouchesが「取りこぼしただろう」と判断して復元した回数
 * missNoEvt: MISS確定の瞬間、直近200ms以内に実イベントが1つも来ていなかった回数
 *            →この値が大きいほど「アプリの判定ミスではなく、Safariがタッチ自体を配送していない」証拠になる
 * missWithEvt: MISS確定の瞬間、直近200ms以内に実イベントが来ていた回数(配送はされたが判定に乗らなかった)*/
const dbgStats={realEvt:0,synthDown:0,synthUp:0,missNoEvt:0,missWithEvt:0,lastRealEventAt:0,missByKind:{},downResult:{},noneCause:{resolved:0,bug:0,tol:0,empty:0},noneTolSum:0,noneTolN:0,revived:0};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function screenPoint(e){const r=cv.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}
function eventPerfMs(e){
  const ts=Number(e.timeStamp),now=performance.now();
  let branch,result;
  if(!Number.isFinite(ts)){branch='invalid';result=now;}
  else if(Math.abs(ts-now)<10000){branch='raw';result=ts;}
  else{
    const epochNow=performance.timeOrigin+now;
    if(Math.abs(ts-epochNow)<100000){branch='epoch';result=ts-performance.timeOrigin;}
    else{branch='fallback';result=now;}
  }
  dbgTs={raw:ts,now,branch,result};
  return result;
}
function eventSongMs(e){return clock.eventChartMs(eventPerfMs(e));}
function pushEv(k,e){
  if(k==='down'||k==='move'){const q0=screenPoint(e);rawTouches.set(e.pointerId,{x:q0.sx,y:q0.sy});}
  else if(k==='up'){rawTouches.delete(e.pointerId);}
  if(clock.state!=='playing')return;const q=screenPoint(e);
  queue.push({kind:k,id:e.pointerId,sx:q.sx,sy:q.sy,t:eventSongMs(e)});}
/* iOS SafariはPointer Events + setPointerCaptureの組み合わせで、既に1本指が
 * 押さえた状態のまま別の指でdownすると新しいpointerdownが発火しない(または
 * 判定に届かない)ことがある。タッチ対応環境では素のTouch Eventsを使い、
 * setPointerCaptureを経由しない経路にすることでこれを回避する。
 * マウスのみの環境(PC)は従来通りPointer Eventsを使う。 */
const supportsTouch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(supportsTouch){
  const mk=(te,t)=>({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,timeStamp:te.timeStamp});
  /* Safariがtouchstartを取りこぼすことがある(特に、既に別指が触れている状態で
   * もう1本を静止させたまま置いた場合)。changedTouchesだけでなく、その時点で
   * ブラウザが認識している「現在触れている全指」(te.touches)を毎イベントごとに
   * rawTouchesと突き合わせ、未登録の指があればその場でdownを復元し、逆に
   * rawTouchesにいるのにte.touchesから消えている指があればupを復元する。
   * これにより、当該の指自身のイベントが飛んでこなくても、他の指のイベントを
   * きっかけに取りこぼしを検知・復旧できる。 */
  function syncTouches(te){
    const rect=cv.getBoundingClientRect();
    const seen=new Set();
    for(const t of te.touches){seen.add(t.identifier);if(!rawTouches.has(t.identifier)){dbgStats.synthDown++;pushEv('down',mk(te,t));}}
    for(const id of Array.from(rawTouches.keys())){
      if(seen.has(id))continue;
      const raw=rawTouches.get(id);
      dbgStats.synthUp++;
      pushEv('up',{pointerId:id,clientX:rect.left+(raw?raw.x:0),clientY:rect.top+(raw?raw.y:0),timeStamp:te.timeStamp});
    }
  }
  const markReal=()=>{dbgStats.realEvt++;dbgStats.lastRealEventAt=performance.now();};
  cv.addEventListener('touchstart',e=>{markReal();for(const t of e.changedTouches)pushEv('down',mk(e,t));syncTouches(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',e=>{markReal();for(const t of e.changedTouches)pushEv('move',mk(e,t));syncTouches(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',e=>{markReal();for(const t of e.changedTouches)pushEv('up',mk(e,t));syncTouches(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchcancel',e=>{markReal();for(const t of e.changedTouches)pushEv('up',mk(e,t));syncTouches(e);e.preventDefault();},{passive:false});
}else{
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){} pushEv('down',e);e.preventDefault();},{passive:false});
  cv.addEventListener('pointermove',e=>{pushEv('move',e);e.preventDefault();},{passive:false});
  cv.addEventListener('pointerup',e=>{pushEv('up',e);e.preventDefault();},{passive:false});
  cv.addEventListener('pointercancel',e=>{pushEv('up',e);e.preventDefault();},{passive:false});
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* ===== 判定コア ===== */
let chart=null,logicMs=null,tapSweep=0,wipeSweep=0,dbgTouch=null,dbgInput=null,dbgEventCount=0;
const J={combo:0,maxCombo:0,accSum:0,accN:0,counts:{BEST:0,COOL:0,GOOD:0,MISS:0},miss:[]};
let lastJudge=null; const fx=[];
const tierOf=e=>{const a=Math.abs(e);return a<=WIN.best?'BEST':a<=WIN.cool?'COOL':a<=WIN.good?'GOOD':a<=WIN.miss?'MISS':null;};
const hitHalfW=w=>Math.max(3,w*0.5+INPUT_SLOP);
const slideTol=w=>hitHalfW(w);
function judgeNowFromChart(chartMs){return chartMs+cfg.tOff;}
function noteJudgeTime(t){return t;}
function addJudge(tier,err,kind,bs){J.counts[tier]++;J.accSum+=ACCW[tier];J.accN++;if(tier==='MISS'){J.combo=0;J.miss.push({kind,bs,err:Math.round(err)});}lastJudge={tier,t0:performance.now(),err};}
function judgeHit(n,err,kind){const t=tierOf(err);if(!t)return false;addJudge(t,err,kind,n.bs);if(t!=='MISS'){J.combo++;J.maxCombo=Math.max(J.maxCombo,J.combo);}fxPush(n.x,n.w,kind==='wipe'?'wipe':'tap');return true;}
function missNote(n,kind){
  if(performance.now()-dbgStats.lastRealEventAt>200)dbgStats.missNoEvt++;
  else{dbgStats.missWithEvt++;dbgStats.missByKind[kind]=(dbgStats.missByKind[kind]||0)+1;}
  addJudge('MISS',1e9,kind,n.bs);}
function fxPush(x,w,kind){if(fx.length>24)fx.shift();fx.push({x,w,kind,t0:performance.now()});}
/* ===== 几何 ===== */
let W=0,H=0,dpr=1,bgImg=null,u2=1;
let judgeY=0,horizonY=0,perspB=1,leadChart=4;
function visualSpeed(){const v=Math.abs(Number(cfg.speed)||0);return Math.max(.05,v);}
function resize(){dpr=Math.min(1.25,window.devicePixelRatio||1);

ctx.fillStyle='#fff';rr(x-wPx/2+3*u2,judgeY-hPx/2+3*u2,wPx-6*u2,hPx-6*u2,4*u2);ctx.fill();
ctx.restore();}
function tracePulse(x,w255,tag){
  fxPush(x,w255,'slide');
}
function drawSlideTrail(S){
  const now=performance.now();
  const pts=S.trail.filter(q=>now-q.t<SLIDE_TRAIL_MS);
  if(!pts.length)return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<pts.length;i++){
    const q=pts[i],a=Math.max(0,1-(now-q.t)/SLIDE_TRAIL_MS);
    const xx=xAt(q.x,judgeY),wp=Math.max(12*u2,S.w/255*fieldW(judgeY)*0.42);
    ctx.globalAlpha=0.32*a;
    ctx.fillStyle='#bfefff';
    rr(xx-wp/2,judgeY-8*u2,wp,16*u2,4*u2);ctx.fill();
  }
  ctx.restore();
}
function traceRect(x,w255,alpha){ /* slide追跡中: 指の下のリボン幅長方形 */
const wPx=Math.max(26*u2,w255/255*fieldW(judgeY));
const hPx=30*u2;
ctx.save();ctx.globalCompositeOperation='lighter';
ctx.globalAlpha=alpha*0.4;
ctx.fillStyle='#8ef';rr(x-wPx*0.62,judgeY-hPx*0.62,wPx*1.24,hPx*1.24,8*u2);ctx.fill();
ctx.globalAlpha=alpha;
ctx.fillStyle='rgba(180,230,255,.8)';rr(x-wPx/2,judgeY-hPx/2,wPx,hPx,5*u2);ctx.fill();
ctx.fillStyle='rgba(255,255,255,.9)';
rr(x-wPx/2+2*u2,judgeY-hPx/2+2*u2,wPx-4*u2,hPx-4*u2,3*u2);ctx.fill();
ctx.restore();}
/* ===== 描画 ===== */
function slab(cx,y,w,h,kind){
const th=h*0.62,sk=th*0.45;
ctx.fillStyle=kind==='wipe'?'#fff6c8':'#ffffff';
ctx.beginPath();
ctx.moveTo(cx-w/2+sk,y-th/2-th*0.5);ctx.lineTo(cx+w/2+sk,y-th/2-th*0.5);
ctx.lineTo(cx+w/2,y-th/2);ctx.lineTo(cx-w/2,y-th/2);ctx.closePath();ctx.fill();
const g=ctx.createLinearGradient(0,y-th/2,0,y+th/2);
if(kind==='wipe'){g.addColorStop(0,'#f9e9a8');g.addColorStop(0.5,'#f2d878');g.addColorStop(1,'#c9a94e');}
else{g.addColorStop(0,'#f4fbff');g.addColorStop(0.5,'#cfe4f2');g.addColorStop(1,'#8fa8bc');}
ctx.fillStyle=g;ctx.beginPath();
ctx.moveTo(cx-w/2+sk,y-th/2);ctx.lineTo(cx+w/2+sk,y-th/2);
ctx.lineTo(cx+w/2,y+th/2);ctx.lineTo(cx-w/2,y+th/2);ctx.closePath();ctx.fill();
ctx.strokeStyle=kind==='wipe'?'rgba(255,240,170,.9)':'rgba(230,245,255,.9)';
ctx.lineWidth=1.2;ctx.stroke();}
let laneEdgeGrad=null,laneEdgeGradJudgeY=null;
function getLaneEdgeGrad(){ /* 毎フレーム2回createLinearGradientしていたのをjudgeY不変な間はキャッシュ */
if(!laneEdgeGrad||laneEdgeGradJudgeY!==judgeY){
laneEdgeGrad=ctx.createLinearGradient(0,0,0,judgeY);
laneEdgeGrad.addColorStop(0,'#7ec8e8');laneEdgeGrad.addColorStop(0.5,'#ffffff');laneEdgeGrad.addColorStop(1,'#dfeef8');
laneEdgeGradJudgeY=judgeY;}
return laneEdgeGrad;}
function draw(nowChartMs){
const drawMs=nowChartMs+cfg.tOff;
const now=drawMs;
ctx.clearRect(0,0,W,H);
if(bgImg){const s=Math.max(W/bgImg.width,H/bgImg.height);
ctx.drawImage(bgImg,(W-bgImg.width*s)/2,(H-bgImg.height*s)/2,bgImg.width*s,bgImg.height*s);}
else{ctx.fillStyle='#101018';ctx.fillRect(0,0,W,H);}
const nowC=posNow(now);
for(const ex of[0,255]){
const x0=xAt(ex,judgeY),x1=xAt(ex,0);
ctx.strokeStyle=getLaneEdgeGrad();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,0);ctx.lineTo(x0,judgeY);ctx.stroke();
ctx.strokeStyle='#1b6f93';ctx.lineWidth=2;ctx.beginPath();
ctx.moveTo(x1+(ex<0?6:-6),0);ctx.lineTo(x0+(ex<0?8:-8),judgeY);ctx.stroke();}
/* slideリボン（ラインで途切る） */
for(const s of chart.slides){
if(s.end<now-250||s.t0>now+cfg.lead+800)continue;
if(s.state==='done')continue;
ctx.fillStyle='rgba(206,209,215,0.5)';
for(let i=0;i<s.nC.length-1;i++){
const c0=s.nC[i],c1=s.nC[i+1],x0=s.nX[i],x1=s.nX[i+1],w0=s.nW[i],w1=s.nW[i+1];
const dc=Math.abs(c1-c0),samples=Math.max(8,Math.min(24,Math.ceil(dc*6)+1));
let prev=null;
for(let q=0;q<=samples;q++){
const f=q/samples,c=c0+(c1-c0)*f;
const y=yOf(c,nowC);
if(!Number.isFinite(y)||y<-90){prev=null;continue;}
const xx=x0+(x1-x0)*f,ww=w0+(w1-w0)*f;
const hw=Math.max(0,ww/255*fieldW(y)/2),cx=xAt(xx,y);
const cur={cx,y,hw};
if(prev){ctx.beginPath();
ctx.moveTo(prev.cx-prev.hw,prev.y);ctx.lineTo(prev.cx+prev.hw,prev.y);
ctx.lineTo(cur.cx+cur.hw,cur.y);ctx.lineTo(cur.cx-cur.hw,cur.y);
ctx.closePath();ctx.fill();}
prev=cur;}}}
ctx.strokeStyle='rgba(255,40,40,.35)';ctx.lineWidth=6;
ctx.beginPath();ctx.moveTo(0,judgeY);ctx.lineTo(W,judgeY);ctx.stroke();
ctx.strokeStyle='#e22';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,judgeY);ctx.lineTo(W,judgeY);ctx.stroke();
/* slide頭 + 追跡中トレース長方形 */
for(const s of chart.slides){
if(s.end<now-200||s.t0>now+cfg.lead+800)continue;
if(s.state==='done')continue;
const y=yOf(s.nC[0],nowC);
if(Number.isFinite(y)&&y>-60)slab(xAt(s.nX[0],y),y,s.nW[0]/255*fieldW(y),34*u2*scaleAtY(y),'tap');
if(s.state==='active'){
  const target=slideXAtTime(s,drawMs),tw=slideWAtTime(s,drawMs);
  const on=s.avgOk;
  const p=s.ptr!==-1?pointers.get(s.ptr):null;
  if(p){drawSlideTrail(s);}
  traceRect(xAt(target,judgeY),tw,on?(0.85+0.12*Math.sin(performance.now()/50)):0.22);
}
}
for(const n of chart.taps){if(n.state)continue;
const y=yOf(n.c,nowC);if(!Number.isFinite(y)||y<-60)continue;
slab(xAt(n.x,y),y,n.w/255*fieldW(y),34*u2*scaleAtY(y),'tap');}
for(const n of chart.wipes){if(n.state!=='pending')continue;
const y=yOf(n.c,nowC);if(!Number.isFinite(y)||y<-60)continue;
slab(xAt(n.x,y),y,n.w/255*fieldW(y),34*u2*scaleAtY(y),'wipe');}
/* hitフラッシュ（長方形） */
for(let i=fx.length-1;i>=0;i--){const f=fx[i];
const k=(performance.now()-f.t0)/380;
if(k>=1){fx.splice(i,1);continue;}
rectFlash(xAt(f.x,judgeY),f.w,k,{tap:'#bfefff',wipe:'#ffe9a0',slide:'#aef'}[f.kind]||'#bfefff');}
/* 生タッチ座標エフェクト: 判定と無関係に「ブラウザが今まさに触れていると言っているか」だけを可視化。
   触れている間ずっと表示し続けるので、離していないのに消えたら=ブラウザ/OS側で取りこぼしている証拠になる */
rawTouches.forEach(d=>{ctx.save();ctx.globalAlpha=0.85;ctx.fillStyle='hsl(28,50%,55%)';
ctx.beginPath();ctx.arc(d.x,d.y,12*u2,0,Math.PI*2);ctx.fill();ctx.restore();});
if(lastJudge){const k=(performance.now()-lastJudge.t0)/500;
if(k<1){ctx.save();ctx.translate(W/2,H*0.58);ctx.scale(0.55,1);
ctx.globalAlpha=(1-k)*0.85;ctx.textAlign='center';
ctx.font=`700 ${150*u2}px system-ui`;
ctx.fillStyle={BEST:'#cfe',COOL:'#fd5',GOOD:'#af6',MISS:'#d8d8dc'}[lastJudge.tier];
ctx.fillText(lastJudge.tier,0,50*u2);ctx.restore();ctx.globalAlpha=1;
if(lastJudge.tier!=='MISS'&&Math.abs(lastJudge.err)>4){
ctx.globalAlpha=1-k;ctx.textAlign='center';ctx.font=`bold ${22*u2}px system-ui`;
ctx.fillStyle=lastJudge.err<0?'#0026ff':'#f00';
ctx.fillText(lastJudge.err<0?'FAST':'SLOW',W/2+(lastJudge.err<0?300:-300)*u2,H-90*u2);
ctx.globalAlpha=1;}}}
const hpW=Math.min(460*u2,Math.max(180,W-168*u2)),hpX=W-18*u2-hpW,hpY=14*u2,hpH=26*u2;
ctx.strokeStyle='#cdd';ctx.lineWidth=2*u2;ctx.strokeRect(hpX,hpY,hpW,hpH);
const hpF=Math.max(0,1-J.counts.MISS*0.02),ticks=46;
for(let i=0;i<ticks*Math.min(1,hpF+0.45);i++){const f=i/ticks;
ctx.fillStyle=i<ticks*hpF?`rgb(${220+35*f},${40+80*f},${60+120*f})`:'rgba(255,220,235,.85)';
ctx.fillRect(hpX+3*u2+i*(hpW-6*u2)/ticks,hpY+3*u2,(hpW-6*u2)/ticks-2*u2,hpH-6*u2);}
ctx.textAlign='center';
ctx.fillStyle='#6ECAEE';ctx.font=`bold ${36*u2}px system-ui`;
ctx.fillText(J.combo?String(J.combo):'0',W/2,118*u2);
ctx.fillStyle='#fff';ctx.font=`bold ${60*u2}px system-ui`;
ctx.fillText(String(J.combo),W/2,178*u2);
ctx.fillStyle='#C24954';ctx.font=`bold ${36*u2}px system-ui`;
ctx.fillText((J.accN?J.accSum/J.accN:0).toFixed(2)+'%',W/2,232*u2);
ctx.fillStyle='#bbb';ctx.font='12px monospace';ctx.textAlign='left';
ctx.fillText(fps,8,H-8);}
let fps=60,fpsN=0,fpsT=performance.now();
/* ===== メインループ ===== */
let rafId=0,dbgTick=0;
function frame(){rafId=requestAnimationFrame(frame);
fpsN++;const ft=performance.now();if(ft-fpsT>1000){fps=fpsN;fpsN=0;fpsT=ft;}
if(!chart){return;}
if(clock.state!=='playing'){draw(clock.chartMs());return;}
const now=clock.chartMs();
if(logicMs===null)logicMs=now-STEP;
queue.sort((a,b)=>a.t-b.t);let qi=0;
const consumeUntil=l=>{while(qi<queue.length&&queue[qi].t<l){const ev=queue[qi++];
if(ev.kind==='down')onDown(ev);else if(ev.kind==='move')onMove(ev);else onUp(ev);}};
if(queue.length&&queue[0].t<logicMs)consumeUntil(logicMs+0.001);
while(logicMs+STEP<=now){const nx=logicMs+STEP;consumeUntil(nx);logicMs=nx;step(logicMs);}
consumeUntil(now+0.001);queue=queue.slice(qi);
draw(now);
if(cfg.dbg&&(++dbgTick%6===0))drawDbg(now);
if(now>songEndMs()){clock.pause();showResult();}}
function songEndMs(){return Math.max(chart.last+1500,clock.bufferEndChartMs());}
function drawDbg(now){const s=chart.slides.find(s=>s.state==='active');
const inp=dbgInput;
document.getElementById('dbg').textContent=
`audio=${clock.audioMs().toFixed(1)} chart=${now.toFixed(1)} judge=${judgeNowFromChart(now).toFixed(1)} draw=${(now+cfg.tOff).toFixed(1)} logic=${(logicMs??0).toFixed(1)} fps=${fps} combo=${J.combo} ptr=${pointers.size} ev=${dbgEventCount} offset=${chart.chartOffset} clock=${clock.timingSource} perfToCtx=${clock.perfToCtxMs.toFixed(2)} speed=${cfg.speed}
input: ${inp?`kind=${inp.kind} perf=${inp.perf.toFixed(1)} audio=${inp.audio.toFixed(1)} chart=${inp.chart.toFixed(1)} dx=${inp.x.toFixed(0)} dy=${inp.y.toFixed(0)}`:'(no input yet)'}
ts: ${dbgTs?`raw=${dbgTs.raw} now=${dbgTs.now.toFixed(1)} branch=${dbgTs.branch} result=${dbgTs.result.toFixed(1)} diff=${(dbgTs.result-dbgTs.now).toFixed(1)}`:'(no event yet)'} dots=${rawTouches.size} inputMode=${supportsTouch?'touch':'pointer'}
slide: ${s?`tx=${slideXAtTime(s,judgeNowFromChart(now)).toFixed(1)} follow=${s.followX.toFixed(1)} tol=${slideTol(slideWAtTime(s,judgeNowFromChart(now))).toFixed(1)} avg=${s.avgErr.toFixed(1)} ok=${s.avgOk} ticks=${s.ticks} nextTick=${s.nextTick.toFixed(1)} cp=${s.cpIndex}/${s.cp.length}`:'-'}
touch: ${dbgTouch?`sx=${dbgTouch.sx} nearestTap dt=${dbgTouch.dt}ms dx=${dbgTouch.dx} (miss-win=${WIN.miss}ms hit-halfW=${dbgTouch.w!==null?hitHalfW(dbgTouch.w).toFixed(1):'-'}) y=${dbgTouch.y} held=${dbgTouch.held} result=${dbgTouch.result}`:'(no touch yet)'}
diag: realEvt=${dbgStats.realEvt} synthDown=${dbgStats.synthDown} synthUp=${dbgStats.synthUp} missNoEvt=${dbgStats.missNoEvt} missWithEvt=${dbgStats.missWithEvt}
missByKind: ${JSON.stringify(dbgStats.missByKind)}
downResult: ${JSON.stringify(dbgStats.downResult)}
noneCause: ${JSON.stringify(dbgStats.noneCause)} avgTolOvershoot=${dbgStats.noneTolN?(dbgStats.noneTolSum/dbgStats.noneTolN).toFixed(1):'-'} revived=${dbgStats.revived}`;}
/* ===== UI ===== */
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hide',!on);
function resetRun(){J.combo=0;J.maxCombo=0;J.accSum=0;J.accN=0;
J.counts={BEST:0,COOL:0,GOOD:0,MISS:0};J.miss.length=0;fx.length=0;lastJudge=null;
logicMs=null;tapSweep=0;wipeSweep=0;queue=[];pointers.clear();dbgInput=null;dbgEventCount=0;dbgTick=0;
for(const n of chart.taps)n.state=0;
for(const w of chart.wipes){w.state='pending';w.ptr=-1;w.entryErr=0;}
for(const s of chart.slides){s.state='pending';s.ptr=-1;s.followX=0;s.noOwnerSince=0;s.nextTick=0;s.ticks=0;
s.cp=[];s.cpIndex=0;s.cpInit=false;s.trail=[];s.startedCombo=false;
s.headJudged=false;s.headTier=null;s.bodyFailed=false;s.buf=[];s.bufSum=0;s.avgErr=0;s.avgOk=false;s.everOk=false;s.lastOkTv=0;s.finalized=false;s.success=false;}}
function startRun(){
  try{
    resetRun();
    clock.init();
    clock.setChartOffset(chart.chartOffset);
    /* Start the source synchronously from the PLAY gesture. Do not wait on resume().
       Some browsers can defer/reject the Promise; waiting here leaves the UI apparently dead. */
    clock.play(0);
    /* Establish the logic cursor on the same chart-time axis used by rendering and input. */
    logicMs=clock.chartMs()-STEP;
    show('load',false);show('pause',false);show('result',false);$('pauseBtn').style.display='block';
    $('dbg').style.display=cfg.dbg?'block':'none';syncPauseControls();
    const resumeP=clock.ctx.resume();
    if(resumeP&&typeof resumeP.catch==='function') resumeP.catch(err=>{
      console.warn('AudioContext resume failed',err);
      clock.pause();clock.state='stopped';
      $('pauseBtn').style.display='none';show('pause',false);show('load',true);
      $('loadMsg').textContent='音声の再生開始に失敗しました: '+(err&&err.message?err.message:String(err));
    });
  }catch(err){
    console.error(err);
    clock.state='stopped';$('pauseBtn').style.display='none';
    show('pause',false);show('load',true);
    $('loadMsg').textContent='PLAY開始エラー: '+(err&&err.message?err.message:String(err));
  }
}
function showResult(){$('pauseBtn').style.display='none';show('result',true);
$('resBody').textContent=
`ACC  ${(J.accN?J.accSum/J.accN:100).toFixed(2)}%
MAXC ${J.maxCombo}
BEST ${J.counts.BEST} / COOL ${J.counts.COOL} / GOOD ${J.counts.GOOD} / MISS ${J.counts.MISS}
slide ticks ${chart.slides.reduce((a,s)=>a+s.ticks,0)}`;
$('resMiss').innerHTML=J.miss.slice(0,200)
.map(m=>`<div class="miss">${m.kind} beat=${m.bs} err=${m.err>1e8?'--':m.err+'ms'}</div>`).join('');}
$('btnPlay').onclick=()=>{
  if(!chart||!clock.buf){$('loadMsg').textContent='mcと音楽が必要です';return;}
  startRun();
};
function pauseGame(){if(clock.state!=='playing')return;clock.pause();syncPauseControls();show('pause',true);}
$('pauseBtn').onclick=pauseGame;
$('btnResume').onclick=()=>{clock.resume();show('pause',false);};
$('btnRetry').onclick=$('btnRetry2').onclick=()=>startRun();
$('btnQuit').onclick=$('btnQuit2').onclick=()=>{clock.pause();clock.state='stopped';
$('pauseBtn').style.display='none';show('pause',false);show('result',false);show('load',true);};
addEventListener('keydown',e=>{if(e.code==='Space'&&clock.state==='playing')pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&clock.state==='playing')pauseGame();});
const bind=(id,key,num)=>$(id).addEventListener('input',e=>{
cfg[key]=num?parseFloat(e.target.value):e.target.checked;
if(key==='lead'||key==='speed')resize();
if(key==='tOff'){
  if($('pTOff'))$('pTOff').value=cfg.tOff;
  if($('pTOffVal'))$('pTOffVal').textContent=Math.round(cfg.tOff)+' ms';
}
if(key==='dbg')$('dbg').style.display=cfg.dbg?'block':'none';});
bind('sTOff','tOff',1);bind('sSpeed','speed',1);bind('sLead','lead',1);
bind('sAuto','auto');bind('sEff','eff');bind('sSuck','suck');
bind('sStartC','startC');bind('sDbg','dbg');
function syncPauseControls(){
$('pSpeed').value=cfg.speed; $('pSpeedVal').textContent=cfg.speed.toFixed(0)+'x';
$('pTOff').value=cfg.tOff; $('pTOffVal').textContent=Math.round(cfg.tOff)+' ms';}
$('pSpeed').addEventListener('input',e=>{cfg.speed=parseFloat(e.target.value);
$('pSpeedVal').textContent=cfg.speed.toFixed(0)+'x';resize();});
$('pTOff').addEventListener('input',e=>{
  cfg.tOff=parseFloat(e.target.value);
  $('pTOffVal').textContent=Math.round(cfg.tOff)+' ms';
  $('sTOff').value=cfg.tOff;
});
function loadFile(f){const n=f.name.toLowerCase();
if(n.endsWith('.mc')||n.endsWith('.json'))f.text().then(t=>{t=t.replace(/^\uFEFF/,'').trim();chart=buildChart(JSON.parse(t));resize();
$('loadMsg').textContent=`譜面OK taps=${chart.taps.length} wipes=${chart.wipes.length} slides=${chart.slides.length} offset=${chart.chartOffset}ms`;})
.catch(()=>{$('loadMsg').textContent='譜面の解析に失敗しました(JSON不正)';});
else if(/\.(ogg|m4a|mp3|wav)$/.test(n)){
clock.init(); /* ユーザー操作のイベントハンドラ内で同期的に生成(Safari対策) */
$('loadMsg').textContent='音楽を読み込み中…';
f.arrayBuffer().then(b=>clock.ctx.decodeAudioData(b))
.then(buf=>{clock.buf=buf;$('loadMsg').textContent='音楽OK';})
.catch(err=>{$('loadMsg').textContent='デコード失敗: '+(err&&err.message?err.message:'このファイル形式はSafariで再生できません(oggで失敗する場合はm4a/mp3をお試しください)');});
}
else if(/\.(jpg|jpeg|png)$/.test(n)){const im=new Image();im.onload=()=>bgImg=im;im.src=URL.createObjectURL(f);}
else $('loadMsg').textContent=`非対応: ${f.name} / 譜面=.mc,.json 音楽=.mp3,.m4a,.ogg,.wav 背景=.jpg,.png`;}
['fMc','fAu','fBg'].forEach(id=>$(id).addEventListener('change',e=>{for(const f of e.target.files)loadFile(f);}));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();for(const f of e.dataTransfer.files)loadFile(f);});
resize();requestAnimationFrame(frame);
</script>
