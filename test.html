<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden;touch-action:none;
-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:#dde}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;background:rgba(8,8,12,.86);z-index:10;padding:16px;box-sizing:border-box}

.panel{width:min(92vw,460px);background:#15151c;border:1px solid #333;border-radius:10px;
padding:14px;font-size:13px;max-height:86vh;overflow:auto}
.panel h2{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}

input[type=number]{width:70px;background:#222;color:#dde;border:1px solid #444;border-radius:4px;padding:3px}
input[type=file]{font-size:11px;color:#aab;width:100%}
button{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-size:14px;margin:4px}
button.sub{background:#444}
#pauseBtn{position:fixed;left:12px;top:12px;z-index:20;display:none;
width:120px;height:88px;margin:0;padding:0;border:2px solid #9ab;border-radius:10px;
background:rgba(15,15,25,.72);color:#eef;cursor:pointer;backdrop-filter:blur(2px)}

.pauseCtrl input[type=range]{width:100%;accent-color:#9fe}

background:rgba(0,0,0,.55);padding:6px;border-radius:6px;white-space:pre;display:none}
.miss{font:11px monospace;color:#f88}
details{margin:6px 0} summary{cursor:pointer;color:#9cf}
</style>

<body>
<canvas id="cv"></canvas>
<div id="dbg"></div>
<div id="load" class="ov">
<div class="panel">
<h2>Malody Slide Test Player v6</h2>
<div class="row"><span class="fl">① 譜面ファイルを選択（.mc / .json）</span><input type="file" id="fMc"></div>
<div class="row"><span class="fl">② 音楽ファイルを選択（.mp3 / .m4a / .ogg / .wav）</span><input type="file" id="fAu"></div>

<div class="row"><label>judge offset ms</label><input type="number" id="sJOff" value="0" step="5"></div>
<div class="row"><label>graphic offset ms</label><input type="number" id="sGOff" value="0" step="5"></div>

</details>
<div class="row"><button id="btnPlay">PLAY</button></div>
<div style="color:#889;font-size:11px">mc+音楽必須 / 背景任意 / D&D対応 / 判定C固定 / Space=pause<br>
slide=頭をタッチ→時間に沿ったリボンを指で追従 / 中継点でチェック演出 / 軌跡エフェクトあり</div>
</div>
</div>
<button id="pauseBtn" type="button" aria-label="Pause">
<strong>Ⅱ</strong><span>Pause</span>
</button>
<div id="pause" class="ov hide"><div class="panel" style="text-align:center"><h2>PAUSE</h2>
<div class="pauseCtrl">
<div class="pauseHead"><label for="pSpeed">ノーツ速度</label><output id="pSpeedVal">1.00x</output></div>
<input type="range" id="pSpeed" min="0.30" max="4.00" step="0.05" value="1.00">
</div>
<div class="pauseCtrl">
<div class="pauseHead"><label for="pGOff">譜面オフセット</label><output id="pGOffVal">0 ms</output></div>
<input type="range" id="pGOff" min="-300" max="300" step="5" value="0">
</div>
<div class="pauseCtrl">
<div class="pauseHead"><label for="pJOff">判定オフセット</label><output id="pJOffVal">0 ms</output></div>
<input type="range" id="pJOff" min="-150" max="150" step="5" value="0">
</div>
<button id="btnResume">RESUME</button><button id="btnRetry" class="sub">RETRY</button>
<button id="btnQuit" class="sub">QUIT</button></div></div>
<div id="result" class="ov hide"><div class="panel"><h2>RESULT</h2>
<pre id="resBody" style="font:12px/1.6 monospace;white-space:pre-wrap"></pre>
<div style="max-height:30vh;overflow:auto" id="resMiss"></div>
<div style="text-align:center"><button id="btnRetry2">RETRY</button>
<button id="btnQuit2" class="sub">QUIT</button></div></div></div>
<script>
"use strict";
/* ===== 定数 ===== */
const WIN={best:36,cool:76,good:110,miss:150}, ACCW={BEST:100,COOL:75,GOOD:40,MISS:0};
const STEP=1000/60, TICK=80, AUTO=-999, INPUT_SLOP=2.5, TRACK_GRACE_MS=120, SLIDE_TRAIL_MS=260;
const cfg={jOff:0,gOff:0,speed:1,lead:1400,auto:false,eff:true,trace:true,suck:true,startC:false,dbg:false};
/* ===== 譜面パース ===== */
const beatF=b=>b[0]+b[1]/(b[2]||1), beatStr=b=>b[2]===1?`${b[0]}`:`${b[0]}+${b[1]}/${b[2]}`;
function buildTiming(a){const evs=(a||[]).filter(t=>t.bpm!==undefined)
.map(t=>({b:beatF(t.beat),bpm:t.bpm})).sort((x,y)=>x.b-y.b);
if(!evs.length)evs.push({b:0,bpm:120}); const ms=[0];
for(let i=0;i<evs.length;i++)if(i+1<evs.length)ms.push(ms[i]+(evs[i+1].b-evs[i].b)*60000/evs[i].bpm);
return{evs,ms};}
function bpmAtBeat(tm,b){const e=tm.evs;let lo=0,hi=e.length-1;
while(lo<hi){const m=(lo+hi+1)>>1;if(e[m].b<=b)lo=m;else hi=m-1;}return e[lo].bpm;}
function beatToMs(tm,b){const{evs,ms}=tm; if(b<=evs[0].b)return ms[0]+(b-evs[0].b)*60000/evs[0].bpm;
let lo=0,hi=evs.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(evs[m].b<=b)lo=m;else hi=m-1;}
return ms[lo]+(b-evs[lo].b)*60000/evs[lo].bpm;}
function msToBeat(tm,t){const{evs,ms}=tm; if(t<=ms[0])return evs[0].b+(t-ms[0])*evs[0].bpm/60000;
let lo=0,hi=evs.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(ms[m]<=t)lo=m;else hi=m-1;}
return evs[lo].b+(t-ms[lo])*evs[lo].bpm/60000;}
function buildEffect(a,tm){const evs=(a||[]).map(e=>({b:beatF(e.beat),scroll:e.scroll,jump:e.jump}))
.sort((x,y)=>x.b-y.b); const eb=[],ebase=[],ecur=[]; let cur=1,prev=0,pos=0;
for(const ev of evs){const p=pos+cur*(ev.b-prev);
const j=p+(ev.jump!==undefined?ev.jump*bpmAtBeat(tm,ev.b)/60000:0);
eb.push(ev.b);ebase.push(j); if(ev.scroll!==undefined)cur=ev.scroll; ecur.push(cur); prev=ev.b;pos=j;}
return{eb,ebase,ecur};}
function chartPosAtBeat(eff,b){if(!eff.eb.length)return b; if(b<=eff.eb[0])return b;
let lo=0,hi=eff.eb.length-1; while(lo<hi){const m=(lo+hi+1)>>1;if(eff.eb[m]<=b)lo=m;else hi=m-1;}
return eff.ebase[lo]+eff.ecur[lo]*(b-eff.eb[lo]);}
function buildChart(json){
const tm=buildTiming(json.time),eff=buildEffect(json.effect,tm),cAt=b=>chartPosAtBeat(eff,b);
const taps=[],wipes=[],slides=[];
for(const n of(json.note||[])){ if(n.type===1)continue;
const b=beatF(n.beat),t=beatToMs(tm,b),x=n.x??128,w=n.w??64;
if(n.seg&&n.seg.length){
const nT=[t],nX=[x],nC=[cAt(b)],nW=[w]; let cw=w;
for(const s of n.seg){ if(s.w!==undefined)cw=s.w; const sb=b+beatF(s.beat);
nT.push(beatToMs(tm,sb)); nX.push(x+(s.x||0)); nC.push(cAt(sb)); nW.push(cw); }
slides.push({
 t0:t,end:nT[nT.length-1],w,bs:beatStr(n.beat),nT,nX,nC,nW,
 state:'pending',ptr:-1,followX:0,badSince:0,nextTick:0,ticks:0,
 cp:[],cpIndex:0,trail:[],startedCombo:false,
 headJudged:false,headTier:null,bodyFailed:false
});
} else if(n.type===4) wipes.push({t,x,w,bs:beatStr(n.beat),c:cAt(b),state:'pending',ptr:-1,entryErr:0,trace:0,lastX:0});
else taps.push({t,x,w,bs:beatStr(n.beat),c:cAt(b),state:0});
}
taps.sort((a,b)=>a.t-b.t);wipes.sort((a,b)=>a.t-b.t);slides.sort((a,b)=>a.t0-b.t0);
const last=Math.max(0,...taps.map(n=>n.t),...wipes.map(n=>n.t),...slides.map(s=>s.end));
return{tm,eff,taps,wipes,slides,last,mainBpm:tm.evs[0].bpm};}
/* ===== 時計 ===== */
const clock={ctx:null,src:null,buf:null,state:'stopped',baseSongMs:0,baseCtxTime:0,p2a:0,
init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();},
calib(){const d=this.ctx.currentTime-performance.now()/1000;this.p2a=this.p2a?this.p2a*0.9+d*0.1:d;},
play(from){if(!this.buf)return;this.kill();const s=this.ctx.createBufferSource();s.buffer=this.buf;
s.connect(this.ctx.destination);const lead=0.06;s.start(this.ctx.currentTime+lead,Math.max(0,from)/1000);
this.src=s;this.baseSongMs=from;this.baseCtxTime=this.ctx.currentTime+lead;this.state='playing';},
kill(){if(this.src){try{this.src.stop()}catch(e){}this.src.disconnect();this.src=null;}},
pause(){if(this.state!=='playing')return;this.baseSongMs=this.songMs();this.kill();this.state='paused';},
resume(){if(this.state==='paused'){this.ctx.resume();this.play(this.baseSongMs);}},
songMs(){return this.state==='playing'?this.baseSongMs+(this.ctx.currentTime-this.baseCtxTime)*1000:this.baseSongMs;},
eventSongMs(ts){return this.baseSongMs+((ts/1000+this.p2a)-this.baseCtxTime)*1000;}};
/* ===== 入力 ===== */
const pointers=new Map(); let queue=[];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function screenPoint(e){const r=cv.getBoundingClientRect();return{sx:e.clientX-r.left,sy:e.clientY-r.top};}
function eventPerfMs(e){
  const ts=Number(e.timeStamp),now=performance.now();
  if(!Number.isFinite(ts))return now;
  if(Math.abs(ts-now)<10000)return ts;
  const epochNow=performance.timeOrigin+now;
  if(Math.abs(ts-epochNow)<100000)return ts-performance.timeOrigin;
  return now;
}
function eventSongMs(e){
  return clock.eventSongMs(eventPerfMs(e));
}
function pushEv(k,e){if(clock.state!=='playing')return;const q=screenPoint(e);
queue.push({kind:k,id:e.pointerId,sx:q.sx,sy:q.sy,t:eventSongMs(e)});}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}
pushEv('down',e);e.preventDefault();},{passive:false});
cv.addEventListener('pointermove',e=>{pushEv('move',e);e.preventDefault();},{passive:false});
cv.addEventListener('pointerup',e=>{pushEv('up',e);e.preventDefault();},{passive:false});
cv.addEventListener('pointercancel',e=>{pushEv('up',e);e.preventDefault();},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* ===== 判定コア ===== */
let chart=null,logicMs=0,tapSweep=0,wipeSweep=0,dbgTouch=null;
const J={combo:0,maxCombo:0,accSum:0,accN:0,counts:{BEST:0,COOL:0,GOOD:0,MISS:0},miss:[]};
let lastJudge=null; const fx=[];
const tierOf=e=>{const a=Math.abs(e);
return a<=WIN.best?'BEST':a<=WIN.cool?'COOL':a<=WIN.good?'GOOD':a<=WIN.miss?'MISS':null;};
const expectT=t=>t-cfg.gOff+cfg.jOff;
const hitHalfW=w=>Math.max(3,w*0.5+INPUT_SLOP);
const trackHalfW=w=>Math.max(4,w*0.5+INPUT_SLOP);
function addJudge(tier,err,kind,bs){J.counts[tier]++;J.accSum+=ACCW[tier];J.accN++;
if(tier==='MISS'){J.combo=0;J.miss.push({kind,bs,err:Math.round(err)});}
lastJudge={tier,t0:performance.now(),err};}
function judgeHit(n,err,kind){const t=tierOf(err);if(!t)return false;
addJudge(t,err,kind,n.bs);if(t!=='MISS'){J.combo++;J.maxCombo=Math.max(J.maxCombo,J.combo);}
fxPush(n.x,n.w,kind==='wipe'?'wipe':'tap');return true;}
function missNote(n,kind){addJudge('MISS',1e9,kind,n.bs);}
function fxPush(x,w,kind){if(fx.length>24)fx.shift();fx.push({x,w,kind,t0:performance.now()});}
/* ===== 几何 ===== */
let W=0,H=0,dpr=1,bgImg=null,u2=1;
let judgeY=0,horizonY=0,perspB=1,leadChart=4;
function resize(){dpr=Math.min(1.25,window.devicePixelRatio||1);
W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);u2=Math.max(.5,Math.min(1.5,H/1080));
judgeY=H*0.92;horizonY=-H*0.35;
const fTop=(0-horizonY)/(judgeY-horizonY);
leadChart=cfg.lead/(60000/(chart?chart.mainBpm:220));
perspB=fTop*leadChart/(Math.max(.05,cfg.speed)*(1-fTop));}
addEventListener('resize',resize);
const clamp01=v=>Math.max(0,Math.min(1,v));
const scaleAtY=y=>clamp01((y-horizonY)/(judgeY-horizonY));
const laneMargin=()=>Math.max(8,Math.min(28,W*0.03));
const fieldW=y=>Math.max(0,W-2*laneMargin())*scaleAtY(y);
const xAt=(x255,y)=>W/2+(x255/255-0.5)*fieldW(y);
function laneX255(sx,y){const r=Math.max(0.001,fieldW(y));
return Math.max(0,Math.min(255,128+(sx-W/2)*255/r));}
const posNow=ms=>cfg.eff?chartPosAtBeat(chart.eff,msToBeat(chart.tm,ms)):ms*chart.mainBpm/60000;
function yOfRaw(c,nowC){const dZ=(c-nowC)/Math.max(.05,cfg.speed);
const den=perspB+dZ; if(den<=0.02)return NaN;
const sc=perspB/den; const y=horizonY+(judgeY-horizonY)*sc;
return Number.isFinite(y)?y:NaN;}
function yOf(c,nowC){const y=yOfRaw(c,nowC);
if(!Number.isFinite(y)||y>judgeY+2*u2)return NaN; return y;}
/* slide gameplay position is time-based (Malody hit test), visual position stays effect-based. */
function slideXAtTime(s,ms){
const T=s.nT,X=s.nX,n=T.length;
if(n===1)return X[0];
if(ms<=T[0])return X[0];
if(ms>=T[n-1])return X[n-1];
let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi+1)>>1;if(T[m]<=ms)lo=m;else hi=m-1;}
const den=T[lo+1]-T[lo],f=den>0?(ms-T[lo])/den:0;
return X[lo]+(X[lo+1]-X[lo])*f;
}
function slideVisualX(s,nowC){
const C=s.nC,n=C.length;
if(n===1)return s.nX[0];
if(nowC<=C[0])return s.nX[0]; if(nowC>=C[n-1])return s.nX[n-1];
let lo=0,hi=n-1;while(lo<hi){const m=(lo+hi+1)>>1;if(C[m]<=nowC)lo=m;else hi=m-1;}
const den=C[lo+1]-C[lo],f=den>0?(nowC-C[lo])/den:0;
return s.nX[lo]+(s.nX[lo+1]-s.nX[lo])*f;
}
function slideWAtTime(s,ms){
 const T=s.nT,WW=s.nW,n=T.length;
 if(n===1)return WW[0];
 if(ms<=T[0])return WW[0];
 if(ms>=T[n-1])return WW[n-1];
 let lo=0,hi=n-1;
 while(lo<hi){const m=(lo+hi+1)>>1;if(T[m]<=ms)lo=m;else hi=m-1;}
 const den=T[lo+1]-T[lo],f=den>0?(ms-T[lo])/den:0;
 return WW[lo]+(WW[lo+1]-WW[lo])*f;
}
const slideHeadY=(s,msVis)=>yOfRaw(s.nC[0],posNow(msVis));
/* ===== 候補探索 / 入力判定 ===== */
function lowerTaps(t){let lo=0,hi=chart.taps.length;
 while(lo<hi){const m=(lo+hi)>>1;if(chart.taps[m].t<t)lo=m+1;else hi=m;}return lo;}
function nearestTap(sx,ms){const a=lowerTaps(ms-WIN.miss-400);let best=null,bd=1e9;
 for(let i=a;i<chart.taps.length;i++){const n=chart.taps[i],et=expectT(n.t);
  if(et>ms+WIN.miss)break; if(ms<et-WIN.miss||n.state)continue;
  const y=yOfRaw(n.c,posNow(ms+cfg.gOff));
  const x=laneX255(sx,Number.isFinite(y)?Math.min(y,judgeY):judgeY);
  if(Math.abs(x-n.x)>hitHalfW(n.w))continue;
  const d=Math.abs(ms-et); if(d<bd){bd=d;best=n;}
 }
 return best;
}
function tryHitWipe(ms,x255){
 let best=null,bestDelay=1e9;
 for(const w of chart.wipes){
  if(w.state!=='pending')continue;
  const et=expectT(w.t);
  if(ms<et||ms>et+WIN.miss)continue;
  if(Math.abs(x255-w.x)>hitHalfW(w.w))continue;
  const delay=ms-et;
  if(delay<bestDelay){bestDelay=delay;best=w;}
 }
 if(!best)return false;
 best.entryErr=ms-expectT(best.t);
 clearWipe(best);
 return true;
}
function nearestSlideHead(sx,ms){
 const x=laneX255(sx,judgeY);let best=null,bestDiff=1e9;
 for(const S of chart.slides){
  if(S.headJudged)continue;
  const et=expectT(S.t0);
  if(ms<et-WIN.miss||ms>et+WIN.miss)continue;
  if(Math.abs(x-S.nX[0])>hitHalfW(S.nW[0]))continue;
  const diff=Math.abs(ms-et);
  if(diff<bestDiff){bestDiff=diff;best=S;}
 }
 return best;
}
function judgeSlideHead(S,ms){
 if(S.headJudged)return;
 const et=expectT(S.t0),err=ms-et,tier=tierOf(err);
 if(!tier)return;
 S.headJudged=true;S.headTier=tier;
 addJudge(tier,err,'slide',S.bs);
 if(tier!=='MISS'){J.combo++;J.maxCombo=Math.max(J.maxCombo,J.combo);}
 fxPush(S.nX[0],S.nW[0],'slide');
}
function tryCatchSlide(ms,x255,ptrId){
 for(const S of chart.slides){
  if(S.state==='done'||S.state==='missed')continue;
  if(ms<S.t0||ms>S.end)continue;
  const target=slideXAtTime(S,ms),ww=slideWAtTime(S,ms);
  if(Math.abs(x255-target)<=hitHalfW(ww)){
   S.state='active';S.ptr=ptrId;S.followX=x255;S.badSince=0;S.released=false;
   return true;
  }
 }
 return false;
}
function failSlideBody(S){
 if(S.bodyFailed)return;
 S.bodyFailed=true;
 if(!S.headJudged){
  S.headJudged=true;S.headTier='MISS';missNote(S,'slide');return;
 }
 if(S.headTier&&S.headTier!=='MISS'){
  J.combo=0;
  J.miss.push({kind:'slide',bs:S.bs,err:1e9});
  lastJudge={tier:'MISS',t0:performance.now(),err:1e9};
 }
}
function clearWipe(w){const t=tierOf(w.entryErr)||'MISS';addJudge(t,w.entryErr,'wipe',w.bs);
 if(t!=='MISS'){J.combo++;J.maxCombo=Math.max(J.maxCombo,J.combo);}
 fxPush(w.x,w.w,'wipe');w.state='cleared';w.ptr=-1;}
/* onDown: wipe吸われを最優先し、その後にslide頭/tap、最後にslide途中再キャッチ */
function onDown(ev){
 const p={sx:ev.sx,sy:ev.sy,x:laneX255(ev.sx,judgeY),y:ev.sy,down:true};
 pointers.set(ev.id,p);
 {
  let nearT=null,nearDt=1e9;
  for(const n of chart.taps){if(n.state)continue;const dt=ev.t-expectT(n.t);
   if(Math.abs(dt)<Math.abs(nearDt)){nearDt=dt;nearT=n;}
  }
  if(nearT){
   const y=yOfRaw(nearT.c,posNow(ev.t+cfg.gOff));
   const xx=laneX255(ev.sx,Number.isFinite(y)?Math.min(y,judgeY):judgeY);
   dbgTouch={sx:ev.sx.toFixed(0),dt:Math.round(nearDt),dx:Math.round(xx-nearT.x),w:nearT.w,y:y.toFixed(0)};

  }
 }
 for(const S of chart.slides){
  if(S.state==='done'||S.state==='missed')continue;
  if(!cfg.auto&&S.state==='active'){
   const p=pointers.get(S.ptr);
   if(!p){S.state='pending';S.ptr=-1;S.badSince=0;}
   else{

.then(buf=>{clock.buf=buf;$('loadMsg').textContent='音楽OK';})
.catch(()=>{$('loadMsg').textContent='デコード失敗(iOSはogg不可→m4a/mp3)';});
else if(/\.(jpg|jpeg|png)$/.test(n)){const im=new Image();im.onload=()=>bgImg=im;im.src=URL.createObjectURL(f);}
else $('loadMsg').textContent=`非対応: ${f.name} / 譜面=.mc,.json 音楽=.mp3,.m4a,.ogg,.wav 背景=.jpg,.png`;}
['fMc','fAu','fBg'].forEach(id=>$(id).addEventListener('change',e=>{for(const f of e.target.files)loadFile(f);}));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();for(const f of e.dataTransfer.files)loadFile(f);});
resize();requestAnimationFrame(frame);
</script>
